<style>
/* Layout: left rail of sections, right a grid of cards; each card opens its own canvas */
:root {
  --ground: #efebe3;
  --panel: #f8f5ef;
  --card: #ffffff;
  --ink: #26241f;
  --muted: #6b665c;
  --line: #d6cfc2;
  --accent: #b23a2e;
  --ok: #3d7a4a;
  --ok-bg: #e3f0e5;
  --draft: #8a6a1f;
  --draft-bg: #f6ecd2;
  --display: "PT Serif", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1b1a18; --panel: #24221f; --card: #2b2925; --ink: #ece7dc; --muted: #a39d90; --line: #3f3b35;
    --accent: #e06a5c; --ok: #8fcf9b; --ok-bg: #233a28; --draft: #e2c27a; --draft-bg: #3a3220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1b1a18; --panel: #24221f; --card: #2b2925; --ink: #ece7dc; --muted: #a39d90; --line: #3f3b35;
  --accent: #e06a5c; --ok: #8fcf9b; --ok-bg: #233a28; --draft: #e2c27a; --draft-bg: #3a3220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); min-height: 100vh; }
.wrap { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
nav a.home { display: inline-block; margin: 0 6px 14px; font: 500 0.85rem var(--body); color: var(--accent); text-decoration: none; }
nav a.home:hover { text-decoration: underline; }
.group { scroll-margin-top: 16px; }
nav h1 { font-family: var(--display); font-size: 1.25rem; margin: 0 6px 4px; }
nav p { color: var(--muted); font-size: 0.8rem; margin: 0 6px 18px; line-height: 1.4; }
nav button { display: flex; justify-content: space-between; align-items: center; width: 100%; font: 500 0.95rem var(--body); color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; text-align: left; }
nav button:hover { background: var(--ground); }
nav button[aria-current="true"] { background: var(--card); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
nav button span { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
nav button:focus-visible, a.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding: 24px 28px 40px; }
main h2 { font-family: var(--display); font-size: 1.5rem; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 60ch; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.thumb { background: var(--panel); display: flex; align-items: center; justify-content: center; height: 240px; padding: 14px; overflow: hidden; flex: none; }
.thumb img { display: block; height: 100%; width: auto; max-width: 100%; object-fit: contain; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.body h3 { margin: 0; font-size: 1rem; font-weight: 600; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.82rem; }
.desc { font-size: 0.86rem; line-height: 1.45; margin: 2px 0 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; align-items: center; }
.tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.draft { background: var(--draft-bg); color: var(--draft); }
a.open { margin-left: auto; font: 500 0.85rem var(--body); color: #fff; background: var(--accent); text-decoration: none; padding: 6px 12px; border-radius: 8px; }
a.open:hover { filter: brightness(1.08); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px; color: var(--muted); max-width: 520px; line-height: 1.5; }
.group { margin: 0 0 28px; }
.group h3 { font-family: var(--display); font-size: 1.15rem; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
.group h3 span { color: var(--muted); font: 400 0.85rem var(--body); }
.icons { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.icons li { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.icons .pic { flex: none; width: 64px; height: 64px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #3a3833; }
.icons .pic img { width: 56px; height: 56px; object-fit: contain; }
.icons .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.icons .nm { font-weight: 500; font-size: 0.9rem; line-height: 1.3; overflow-wrap: anywhere; }
.icons .nm.none { color: var(--muted); font-weight: 400; font-style: italic; }
.icons .fn { color: var(--muted); font: 0.78rem ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.find { font: 0.9rem var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: min(360px, 100%); margin: 0 0 18px; }
.icons li { cursor: pointer; }
.icons li:hover { border-color: var(--accent); }
.icons li:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
dialog.inv { border: 0; padding: 0; border-radius: 14px; background: #1a1a1f; color: #ece7dc; max-width: calc(100vw - 32px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
dialog.inv::backdrop { background: rgba(10,10,12,0.6); }
.inv .stage { padding: 28px 28px 18px; display: flex; justify-content: center; overflow: auto; }
.inv .board { position: relative; display: grid; gap: var(--gap); }
.inv .cell { width: var(--cell); height: var(--cell); background: rgba(41,43,56,0.92); border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
.inv .tile { position: absolute; background: #292b38; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.inv .tile img { position: absolute; left: 50%; top: 50%; object-fit: contain; transform: translate(-50%, -50%); }
.inv .info { border-top: 1px solid #33313a; padding: 14px 20px 18px; display: grid; gap: 6px; }
.inv .info b { font-size: 1.02rem; font-weight: 600; }
.inv .row { display: flex; gap: 18px; flex-wrap: wrap; color: #a39d90; font-size: 0.88rem; }
.inv .row span strong { color: #ece7dc; font-weight: 500; }
.inv .x { position: absolute; top: 8px; right: 10px; background: transparent; border: 0; color: #a39d90; font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px 8px; }
.inv .x:hover { color: #ece7dc; }
@media (max-width: 720px) {
  .wrap { grid-template-columns: 1fr; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; }
  nav .list { display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { width: auto; }
  main { padding: 18px 16px 32px; }
}
nav .secs { display: flex; gap: 6px; margin: 0 6px 16px; }
nav button.sec { width: auto; flex: 1; justify-content: center; border: 1px solid var(--line); background: var(--card); font-weight: 600; }
nav button.sec[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.shots .shot { font: inherit; color: var(--ink); text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 8px; cursor: pointer; }
.shots .shot:hover { border-color: var(--accent); }
.shots .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shots .shot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: #3a3833; }
.shots .shot b { font-weight: 500; font-size: 0.92rem; line-height: 1.3; padding: 0 2px 2px; }
dialog.shotview { border: 0; padding: 0; border-radius: 14px; background: #1a1a1f; color: #ece7dc; width: min(960px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
dialog.shotview::backdrop { background: rgba(10,10,12,0.7); }
.shotview > img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #111; }
.shotview .info { padding: 14px 20px 18px; display: grid; gap: 8px; }
.shotview .info b { font-size: 1.05rem; font-weight: 600; }
.shotview .info p { margin: 0; color: #c9c3b7; line-height: 1.5; font-size: 0.92rem; }
.shotview .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.shotview .nb { font: 500 0.88rem var(--body); color: #ece7dc; background: #2b2b33; border: 1px solid #3a3a44; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.shotview .nb:disabled { visibility: hidden; }
.shotview .pos { color: #a39d90; font: 0.8rem ui-monospace, SFMono-Regular, Menlo, monospace; }
.shotview .x { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,0.45); border: 0; color: #ece7dc; font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px 10px; border-radius: 8px; }
@media (max-width: 720px) { nav .secs { margin: 0 0 10px; } }
</style>
</head>

  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  let current = SECTIONS[0].id;
  try { const s = localStorage.getItem('guide-section'); if (SECTIONS.some(x => x.id === s)) current = s; } catch (e) {}
  const fromHash = location.hash.slice(1); if (SECTIONS.some(x => x.id === fromHash)) current = fromHash;

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function renderNav() {
    nav.textContent = '';
    const secs = el('div', 'secs');
    for (const x of SECTIONS) {
      const b = el('button', 'sec', x.title);
      b.setAttribute('aria-pressed', String(x.id === current));
      b.addEventListener('click', () => { current = x.id; try { localStorage.setItem('guide-section', current); } catch (e) {} history.replaceState(null, '', '#' + current); render(); window.scrollTo(0, 0); });
      secs.appendChild(b);
    }
    nav.appendChild(secs);
    const cur = SECTIONS.find(x => x.id === current);
    (cur.groups || cur.photos || []).forEach((g, i) => {
      const b = el('button');
      b.append(el('b', null, g.title), el('span', null, String(g.items.length)));
      b.addEventListener('click', () => { const t = document.getElementById('g-' + i); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      nav.appendChild(b);
    });
  }

  function weightText(kg) {
    if (kg == null) return '—';
    if (kg < 1) return Math.max(1, Math.round(kg * 1000)) + ' г';
    return (Math.round(kg * 100) / 100).toString().replace('.', ',') + ' кг';
  }

  let dlg = null;
  function showInv(x) {
    if (!dlg) {
      dlg = el('dialog', 'inv');
      dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
      document.body.appendChild(dlg);
    }
    dlg.textContent = '';
    const s = x.s || [1, 1];
    const cell = Math.min(96, Math.floor((Math.min(window.innerWidth, 560) - 120) / (s[0] + 2) * 0.9));
    const gap = Math.round(cell * 6 / 62);
    const cols = s[0] + 2, rows = s[1] + 2;
    const stage = el('div', 'stage');
    const board = el('div', 'board');
    board.style.setProperty('--cell', cell + 'px'); board.style.setProperty('--gap', gap + 'px');
    board.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cell + 'px)';
    for (let i = 0; i < cols * rows; i++) board.appendChild(el('div', 'cell'));
    const tw = s[0] * cell + (s[0] - 1) * gap, th = s[1] * cell + (s[1] - 1) * gap;
    const tile = el('div', 'tile');
    tile.style.left = (cell + gap) + 'px'; tile.style.top = (cell + gap) + 'px';
    tile.style.width = tw + 'px'; tile.style.height = th + 'px';
    const img = el('img'); img.alt = x.n || x.f;
    img.style.width = tw + 'px'; img.style.height = th + 'px';
    img.onload = () => {
      if ((img.naturalWidth - img.naturalHeight) * (tw - th) < 0) {
        img.style.width = th + 'px'; img.style.height = tw + 'px';
        img.style.transform = 'translate(-50%, -50%) rotate(-90deg)';
      }
    };
    img.src = 'icons/' + x.f + '.png?v=108';
    tile.appendChild(img); board.appendChild(tile); stage.appendChild(board);
    const info = el('div', 'info');
    info.appendChild(el('b', null, x.n || 'без предмета'));
    const row = el('div', 'row');
    const part = (k, v) => { const sp = el('span', null, k + ' '); sp.appendChild(el('strong', null, v)); return sp; };
    row.append(part('Размер', x.s ? s[0] + '×' + s[1] : '—'), part('Вес', weightText(x.w)), part('Файл', x.f + '.png'));
    info.appendChild(row);
    const close = el('button', 'x', '×'); close.setAttribute('aria-label', 'Закрыть'); close.addEventListener('click', () => dlg.close());
    dlg.append(close, stage, info);
    dlg.showModal();
  }

  function renderIcons(s) {
    const find = el('input', 'find'); find.type = 'search'; find.placeholder = 'Найти по имени или файлу'; find.setAttribute('aria-label', 'Поиск иконки');
    const box = el('div');
    main.append(find, box);
    function draw() {
      const q = find.value.trim().toLowerCase();
      box.textContent = '';
      for (const g of s.groups) {
        const list = g.items.filter(x => !q || (x.n + ' ' + x.f).toLowerCase().includes(q));
        if (!list.length) continue;
        const sec = el('section', 'group'); sec.id = 'g-' + s.groups.indexOf(g);
        const h = el('h3', null, g.title); h.appendChild(el('span', null, String(list.length)));
        const ul = el('ul', 'icons');
        for (const x of list) {
          const li = el('li');
          const pic = el('div', 'pic'); const img = el('img'); img.src = 'icons/' + x.f + '.png?v=108'; img.alt = x.n || x.f; img.loading = 'lazy'; pic.appendChild(img);
          const txt = el('div', 'txt');
          txt.append(el('div', 'nm' + (x.n ? '' : ' none'), x.n || 'без предмета'), el('div', 'fn', x.f + '.png'));
          li.append(pic, txt);
          li.tabIndex = 0; li.setAttribute('role', 'button');
          li.addEventListener('click', () => showInv(x));
          li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showInv(x); } });
          ul.appendChild(li);
        }
        sec.append(h, ul); box.appendChild(sec);
      }
    }
    find.addEventListener('input', draw);
    draw();
  }

  function renderMain() {
    const s = SECTIONS.find(x => x.id === current);
    main.textContent = '';
    main.append(el('h2', null, s.title), el('p', 'lead', s.lead));
    if (s.groups) { renderIcons(s); return; }
    if (s.photos) { renderPhotos(s); return; }
    if (!s.items.length) { main.append(el('div', 'empty', 'Пока ничего нет')); return; }
    const grid = el('div', 'grid');
    for (const it of s.items) {
      const card = el('article', 'card');
      const th = el('div', 'thumb');
      const img = el('img'); img.src = it.img; img.alt = 'Обложка: ' + it.title; img.loading = 'lazy';
      th.appendChild(img);
      const body = el('div', 'body');
      body.append(el('h3', null, it.title), el('div', 'meta', it.meta), el('p', 'desc', it.desc));
      const tags = el('div', 'tags');

      const a = el('a', 'open', 'Открыть'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
      tags.appendChild(a);
      body.appendChild(tags);
      card.append(th, body);
      grid.appendChild(card);
    }
    main.appendChild(grid);
  }

  let shotDlg = null, shotList = null, shotAt = 0;
  function showShot(list, i) {
    shotList = list; shotAt = i;
    if (!shotDlg) {
      shotDlg = el('dialog', 'shotview');
      shotDlg.addEventListener('click', e => { if (e.target === shotDlg) shotDlg.close(); });
      shotDlg.addEventListener('keydown', e => {
        const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (d) { e.preventDefault(); step(d); }
      });
      document.body.appendChild(shotDlg);
    }
    const x = list[i];
    shotDlg.textContent = '';
    const img = el('img'); img.src = 'photos/' + x.f + '.jpg?v=7'; img.alt = x.n;
    const info = el('div', 'info');
    const top = el('div', 'top');
    const prev = el('button', 'nb', '← Предыдущий'); prev.disabled = i === 0; prev.addEventListener('click', () => step(-1));
    const next = el('button', 'nb', 'Следующий →'); next.disabled = i === list.length - 1; next.addEventListener('click', () => step(1));
    top.append(prev, el('span', 'pos', (i + 1) + ' из ' + list.length), next);
    info.append(top, el('b', null, x.n), el('p', null, x.cap));
    const close = el('button', 'x', '×'); close.setAttribute('aria-label', 'Закрыть'); close.addEventListener('click', () => shotDlg.close());
    shotDlg.append(close, img, info);
    if (!shotDlg.open) shotDlg.showModal();
  }
  function step(d) { const n = shotAt + d; if (shotList && n >= 0 && n < shotList.length) showShot(shotList, n); }

  function renderPhotos(s) {
    s.photos.forEach((g, gi) => {
      const sec = el('section', 'group'); sec.id = 'g-' + gi;
      const h = el('h3', null, g.title); h.appendChild(el('span', null, String(g.items.length)));
      const grid = el('div', 'shots');
      g.items.forEach((x, i) => {
        const a = el('button', 'shot');
        const img = el('img'); img.src = 'photos/' + x.f + '.jpg?v=7'; img.alt = ''; img.loading = 'lazy';
        a.append(img, el('b', null, x.n));
        a.addEventListener('click', () => showShot(g.items, i));
        grid.appendChild(a);
      });
      sec.append(h, grid); main.appendChild(sec);
    });
  }

  function render() { renderNav(); renderMain(); }
  render();
})();
</script>
</body>
</html>
