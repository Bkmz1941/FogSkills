<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta name="google" content="notranslate">

<style>
/* layout: a full-window map of square tiles that the camera never leaves; a title chip top-left; zoom and scale
   bottom-right above a white tool tray that docks at the bottom while the map is being built. One light look, like a street map. */
:root {
  --land: #F8F9FA;
  --grid: #DADCE0;
  --edge: #BDC1C6;
  --ink: #3C4043;
  --ink-dim: #80868B;
  --chip: #FFFFFF;
  --blue: #1A73E8;
  --blue-soft: #E8F0FE;
  --red: #D93025;
  --font: 'Roboto', Arial, 'Helvetica Neue', sans-serif;
  --tray-h: 112px;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--land); color: var(--ink); font-family: var(--font); overflow: hidden; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.panning { cursor: grabbing; }
#map.drawing { cursor: crosshair; }
#map.over-feature { cursor: pointer; }
#map.over-handle { cursor: move; }

.chip {
  position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
  max-width: calc(100% - 230px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  background: var(--chip); border-radius: 8px; box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 2px 6px rgba(60,64,67,0.15);
  padding: 10px 16px; display: flex; flex-direction: column; gap: 2px;
}
.chip h1 { margin: 0; font: 500 16px/1.3 var(--font); color: var(--ink); }
.chip p { margin: 0; font: 400 13px/1.4 var(--font); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.chip p b { font-weight: 500; color: var(--blue); }

.zoom {
  position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(var(--tray-h) + 40px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; background: var(--chip); border-radius: 8px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 2px 6px rgba(60,64,67,0.15);
}
.zoom button {
  width: 40px; height: 40px; border: none; background: var(--chip); color: var(--ink-dim);
  font: 500 15px var(--font); cursor: pointer; font-variant-numeric: tabular-nums;
}
.zoom button + button { border-top: 1px solid var(--grid); }
.zoom button:hover { background: #F1F3F4; color: var(--ink); }
.zoom button[aria-current="true"] { background: var(--blue-soft); color: var(--blue); }
.zoom button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

.scale {
  position: fixed; right: calc(68px + env(safe-area-inset-right, 0px)); bottom: calc(var(--tray-h) + 14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 2px; pointer-events: none;
  font: 500 11px var(--font); color: var(--ink); text-shadow: 0 0 2px var(--chip), 0 0 2px var(--chip);
}
.scale i { display: block; height: 5px; border: 1.5px solid var(--ink); border-top: none; }
.status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* the place card: a white popup beside a place with its name and photo */
.popup {
  position: fixed; z-index: 4; width: 312px; max-width: calc(100vw - 32px); background: var(--chip); border-radius: 10px;
  box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 14px rgba(60,64,67,0.18); overflow: hidden; pointer-events: auto;
}
.popup img { display: block; width: calc(100% - 20px); margin: 1px 10px 10px; height: 182px; object-fit: cover; background: #F1F3F4; border-radius: 8px; box-sizing: border-box; }
.popup .pbody { padding: 6px 10px 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.popup .phead { display: flex; align-items: flex-start; gap: 6px; }
.popup h3 { margin: 0; flex: 1; min-width: 0; font: 500 14px/1.3 var(--font); color: var(--ink); }
.popup p { margin: 0; font: 400 11px/1.3 var(--font); color: var(--ink-dim); }
.popup .pclose {
  flex: none; width: 14px; height: 18px; border: none; border-radius: 4px; background: transparent; margin-top: 0; display: grid; place-items: center;
  color: var(--ink-dim); font: 400 18px/20px var(--font); cursor: pointer; padding: 0;
}
.popup .pclose:hover { color: var(--ink); }
.popup .pclose:focus-visible { outline: 2px solid var(--blue); }
.popup .noimg { height: 4px; background: var(--blue-soft); }
.tray[hidden], .popup[hidden] { display: none; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
/* view / build switch, top-right */
.mode {
  position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 5;
  display: inline-flex; background: var(--chip); border-radius: 20px; padding: 3px; box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 2px 6px rgba(60,64,67,0.15);
}
.mode button {
  min-height: 34px; padding: 0 14px; border: none; border-radius: 17px; background: transparent; color: var(--ink-dim);
  font: 500 14px var(--font); cursor: pointer; white-space: nowrap;
}
.mode button:hover { color: var(--ink); }
.mode button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue); }
.mode button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

/* the tool tray: tabs on top, the active tab's tools below */
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--chip); color: var(--ink);
  padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 -1px 2px rgba(60,64,67,0.2), 0 -2px 8px rgba(60,64,67,0.12);
}
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; justify-content: center; }
.tab {
  background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -1px;
  padding: 4px 12px; min-height: 32px; font: 500 14px var(--font); color: var(--ink-dim); cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
.tab:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; border-radius: 6px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 44px; }
.tool {
  min-height: 34px; padding: 0 12px; border: 1px solid var(--grid); border-radius: 20px; background: var(--chip);
  font: 500 14px var(--font); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.tool:hover { background: #F1F3F4; }
.tool[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue-soft); color: var(--blue); }
.tool:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.tool.primary { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
.tool.primary:hover { background: #1765CC; }
.tool.danger { color: var(--red); }
.tool i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; flex: none; }
.tool i.round { border-radius: 50%; }
.tool i.line { height: 5px; border-radius: 3px; }
.pair { display: inline-flex; border: 1px solid var(--grid); border-radius: 20px; overflow: hidden; }
.pair .tool { border: none; border-radius: 0; }
.pair .tool + .tool { border-left: 1px solid var(--grid); }
.hint { font: 400 13px var(--font); color: var(--ink-dim); max-width: 48ch; }
.text { min-height: 34px; width: 220px; max-width: 60vw; padding: 0 12px; border: 1px solid var(--grid); border-radius: 8px; font: 400 14px var(--font); color: var(--ink); background: var(--chip); }
.text:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
.tool i.text-big, .tool i.text-mid, .tool i.text-small { width: auto; height: auto; border-radius: 0; background: none; font-style: normal; color: var(--ink); line-height: 1; }
.tool i.text-big { font: 700 15px var(--font); letter-spacing: 0.08em; }
.tool i.text-mid { font: 500 13px var(--font); }
.tool i.text-small { font: 400 11px var(--font); }
.tool i.text-water { width: auto; height: auto; border-radius: 0; background: none; font: italic 500 13px var(--font); color: #3B7DBF; line-height: 1; }
.tool i.text-water::before { content: 'Река'; }
.tool i.text-big::before { content: 'ГОРОД'; } .tool i.text-mid::before { content: 'Посёлок'; } .tool i.text-small::before { content: 'Улица'; }
.label { font: 500 14px var(--font); color: var(--ink); }
.sep { width: 1px; align-self: stretch; background: var(--grid); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="map" aria-label="Карта окрестностей «Сосен», сетка 16 на 16 квадратов"></canvas>
<header class="chip">
  <h1>Окрестности «Сосен»</h1>
  <p id="info">16 × 16 квадратов по 1 км</p>
</header>

  <div class="tools" id="tools" role="tabpanel"></div>
</div>
<span class="status" id="status" aria-live="polite"></span>

<script>
(function () {
  document.documentElement.lang = 'ru'; document.documentElement.classList.add('notranslate');
  // The world is N × N square tiles; world units are tiles, y grows downward, 1 tile = TILE_KM km.
  // The camera always stays inside the world; A1 is the far top-left. Zoom 1 is right up close, 2 is closer, 3 shows
  // the whole map (it covers the screen with it). Per-level arrays below go [close, mid, far].
  var N = 16, TILE_KM = 1;
  var COLS = 'ABCDEFGHIJKLMNOP';
  var ZOOM_MUL = [10, 3.2, 1];
  var LEVELS = [960, 216, 48];
  var C = { land: '#F8F9FA', nodata: '#F1F3F4', hatch: '#E1E4E8', grid: '#DADCE0', edge: '#BDC1C6', ink: '#3C4043', dim: '#80868B', blue: '#1A73E8', red: '#D93025' };
  var FONT = "'Roboto', Arial, sans-serif";

  var canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
  var info = document.getElementById('info'), statusEl = document.getElementById('status');
  var dpr = 1, W = 0, H = 0;
  var level = 2, view = { x: N / 2, y: N / 2, k: LEVELS[2] };
  var hover = null, hoverPx = null, picked = null;
  function setStatus(t) { statusEl.textContent = t; }

  function tileName(c, r) { return COLS[c] + (r + 1); }
  function sx(x) { return W / 2 + (x - view.x) * view.k; }
  function sy(y) { return H / 2 + (y - view.y) * view.k; }
  function wx(px) { return view.x + (px - W / 2) / view.k; }
  function wy(py) { return view.y + (py - H / 2) / view.k; }
  function tileAt(px, py) {
    var c = Math.floor(wx(px)), r = Math.floor(wy(py));
    return c >= 0 && r >= 0 && c < N && r < N ? { c: c, r: r } : null;
  }
  function visibleRange() {
    return {
      c0: Math.max(0, Math.floor(wx(0))), c1: Math.min(N - 1, Math.floor(wx(W))),
      r0: Math.max(0, Math.floor(wy(0))), r1: Math.min(N - 1, Math.floor(wy(H)))
    };
  }

  // ---- Tiles. Each has a setting: data on or off. A tile with data off shows a "no data" hatch and draws
  // nothing of the map inside it, so the world can be built one square at a time. ----
  var tiles = {}, tilesCol = null;
  function tileOn(c, r) { var t = tiles[tileName(c, r)]; return !!(t && t.on); }
  function setTileOn(c, r, on) {
    var name = tileName(c, r), was = tileOn(c, r); tiles[name] = { on: on };
    if (was !== on) commit({ tile: name, before: was, after: on });
    if (tilesCol) tilesCol.doc(name).set({ on: on }).then(function () { setStatus('Квадрат ' + name + ': данные ' + (on ? 'включены' : 'выключены')); }).catch(function () { setStatus('Не сохранилось — попробуйте ещё раз'); });
    renderTools(); draw();
  }
  var hatch = null, hatchFor = 0;
  function hatchPattern() {
    if (hatch && hatchFor === dpr) return hatch;
    var s = 12, c = document.createElement('canvas'); c.width = c.height = Math.round(s * dpr);
    var g = c.getContext('2d'); g.scale(dpr, dpr); g.fillStyle = C.nodata; g.fillRect(0, 0, s, s);
    g.strokeStyle = C.hatch; g.lineWidth = 1.5; g.lineCap = 'square';
    g.beginPath(); g.moveTo(-2, s + 2); g.lineTo(s + 2, -2); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(s - 2, s + 2); g.lineTo(s + 2, s - 2); g.stroke();
    hatch = ctx.createPattern(c, 'repeat'); hatchFor = dpr; hatch.setTransform && hatch.setTransform(new DOMMatrix().scale(1 / dpr));
    return hatch;
  }
  function drawNoData(c, r) {
    var k = view.k, x = sx(c), y = sy(r);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = hatchPattern(); ctx.fillRect(0, 0, k, k);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.dim;
    if (level < 2) {
      ctx.font = '500 ' + (level === 0 ? 16 : 13) + 'px ' + FONT; ctx.fillText('Нет данных', k / 2, k / 2 - 2);
      ctx.font = '400 ' + (level === 0 ? 13 : 11) + 'px ' + FONT; ctx.fillText(tileName(c, r), k / 2, k / 2 + (level === 0 ? 18 : 14));
    } else { ctx.font = '500 11px ' + FONT; ctx.fillText(tileName(c, r), k / 2, k / 2); }
    ctx.restore();
  }

  // ---- Features: everything drawn on the map. One document each in the "features" collection.
  // road {style, pts}, area {style, pts}, building {x, y, w, h, rot}, tree {x, y}. Points are in world units. ----
  var features = [], featCol = null;
  var ROADS = {
    highway: { name: 'Шоссе', fill: '#F9D77E', edge: '#E3B54A', w: [24, 14, 6] },
    road:    { name: 'Дорога', fill: '#FFFFFF', edge: '#C6C9CE', w: [16, 9, 4] },
    dirt:    { name: 'Грунтовка', fill: '#EADFC6', edge: '#CDBE9D', w: [11, 6, 2.5] },
    path:    { name: 'Тропа', fill: '#9AA0A6', edge: null, w: [3.5, 2, 1], dash: true }
  };
  var AREAS = {
    forest: { name: 'Лес', fill: '#C6E6C6', edge: '#B0D6B0' },
    lawn:   { name: 'Поляна', fill: '#E4F1D6', edge: '#CFE3BC' },
    water:  { name: 'Вода', fill: '#AADAFF', edge: '#92C8F2' },
    field:  { name: 'Поле', fill: '#F0ECD6', edge: '#E2DCC0' },
    swamp:  { name: 'Болото', fill: '#D2E6DA', edge: '#B5D2C1', marsh: true },
    sand:   { name: 'Песок', fill: '#F3E7C6', edge: '#E4D4A6' }
  };
  // Buildings have a little volume, as on Yandex Maps: the roof is lifted by the floors' height and the walls show
  // below it, lit from the top-left. A building under the cursor warms up; a selected one is drawn flat for editing.
  var BUILDING = { fill: '#ECE7DE', hover: '#FBF1D4', wall: '#D5CCBD', edge: '#C9C1B2', floor: 0.0032 }, TREE = { fill: '#A7D2A5', edge: '#82B382', rw: 0.03 };
  // Trees scale with the map: crown radius is TREE.rw tiles (30 m), so they shrink and grow with the zoom.
  function treeR() { return view.k * TREE.rw; }
  var hoverFeat = null;
  // Tree kinds: a round crown, a pointed fir, a pine with a double crown, a small bush.
  var TREES = {
    tree: { name: 'Дерево', fill: '#A7D2A5', edge: '#82B382' },
    fir:  { name: 'Ель', fill: '#8DC28F', edge: '#699F6C' },
    pine: { name: 'Сосна', fill: '#B2D6A3', edge: '#8CB882' },
    bush: { name: 'Куст', fill: '#B9DEB3', edge: '#93C28F' }
  };
  // Places: a round badge with a white icon and a name beside it, as transit stops and churches are shown on street maps.
  var POIS = {
    busstop: { name: 'Остановка', color: '#1A73E8' },
    church:  { name: 'Храм', color: '#8E63B5' },
    place:   { name: 'Место', color: '#F29900' }
  };
  var POI_R = [13, 10, 6], poiBoxes = [];
  // A bench: a small turnable piece of street furniture, drawn at a fixed screen size and hidden when far out.
  var BENCH = { len: [22, 13, 0], seat: '#B07F52', back: '#8F6540', leg: '#4A4440' };
  // A «place» is a star; its badge colour is the user's choice.
  var POI_COLORS = [['Серый', '#5F6368'], ['Красный', '#D93025'], ['Оранжевый', '#F29900'], ['Зелёный', '#188038'], ['Синий', '#1A73E8'], ['Фиолетовый', '#8E63B5']];
  function poiColor(f) { var st = POIS[f.type] || POIS.place; return f.type === 'place' && f.color ? f.color : st.color; }
  // Labels come in three sizes, each shown at one zoom only: big at 3 (the whole map), mid at 2, small at 1.
  var LABELS = {
    big:   { name: 'Большая', level: 2, font: '700 20px', px: 20, color: '#3C4043', upper: true, ls: '0.08em' },
    mid:   { name: 'Средняя', level: 1, font: '500 15px', px: 15, color: '#5F6368' },
    small: { name: 'Маленькая', level: 0, font: '400 12px', px: 12, color: '#70757A' }
  };
  var labelBoxes = [];
  // Water names: blue italics laid along a line the user draws down a river or round a lake shore.
  // Shown whenever the line is long enough on screen for the text, so they thin out by themselves when zooming out.
  var WLABEL = { color: '#3B7DBF', px: [15, 13, 11] };
  // Hills, as the terrain layer draws them: a faint tan tint and thin contour rings closing in on the peak,
  // one ring per HILL.step metres, every fifth a little darker. A ravine (negative height) has dashed rings.
  var HILL = { step: 10, dash: [4, 3] };
  // Two colourings: green sits on forest (the default), brown reads as bare ground.
  var HILL_COLORS = {
    green: { name: 'Зелёный', tint: 'rgba(160,196,150,0.35)', far: 'rgba(140,180,130,0.14)', line: '#6FA070', index: '#4E8352' },
    brown: { name: 'Коричневый', tint: 'rgba(222,208,180,0.45)', far: 'rgba(205,188,155,0.18)', line: '#C9B48E', index: '#B39A6E' }
  };
  function hillColors(f) { return HILL_COLORS[f.color] || HILL_COLORS.green; }
  var tool = null;          // null or {kind:'road'|'area'|'building'|'tree', style}
  var draft = null;         // road/area: list of points being placed
  var sel = null;           // the selected feature (object from features)
  var multi = [];           // several selected features (Shift+click or Shift+drag a box); then sel is null
  var handles = [];
  function isSel(f) { return f === sel || multi.indexOf(f) >= 0; }
  function selList() { return multi.length ? multi : (sel ? [sel] : []); }
  // Move a feature by (dx, dy) world units, whatever its shape.
  function shiftFeat(f, dx, dy) {
    if (f.pts) { for (var i = 0; i < f.pts.length; i += 2) { f.pts[i] += dx; f.pts[i + 1] += dy; } if (f.peak) f.peak = [f.peak[0] + dx, f.peak[1] + dy]; }
    else { f.x += dx; f.y += dy; }
  }
  function roundFeat(f) { if (f.pts) { f.pts = f.pts.map(r4); if (f.peak) f.peak = f.peak.map(r4); } else { f.x = r4(f.x); f.y = r4(f.y); } }
  function featAnchor(f) { if (!f.pts) return [f.x, f.y]; var p = pairs(f.pts), cx = 0, cy = 0; p.forEach(function (q) { cx += q[0]; cy += q[1]; }); return [cx / p.length, cy / p.length]; }
  function newId() { return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function byId(id) { for (var i = 0; i < features.length; i++) if (features[i].id === id) return features[i]; return null; }
  function r4(v) { return Math.round(v * 10000) / 10000; }
  function featDoc(f) {

      if (draft) { draft.push([x, y]); setStatus('Точка ' + draft.length); } else { draft = [[x, y]]; setStatus('Первая точка'); }
      renderTools(); draw(); return;
    }
    var hitF = tab === 'tile' ? null : featureAt(p[0], p[1]);
    if (hitF && e.shiftKey) { toggleMulti(hitF); return; }
    if (hitF) { if (sel !== hitF || multi.length) select(hitF); return; }
    if (sel || multi.length) { select(null); return; }
    var t = tileAt(p[0], p[1]);
    picked = t && !(picked && picked.c === t.c && picked.r === t.r) ? t : null;
    if (picked && tab !== 'tile') { tab = 'tile'; renderTabs(); }
    showInfo(); renderTools(); draw();
    setStatus(picked ? 'Выбран квадрат ' + tileName(picked.c, picked.r) : 'Выбор снят');
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('dblclick', function (e) { if (tool || sel) return; var p = local(e); setLevel(level - 1, p[0], p[1]); });

  var wheelAcc = 0, wheelAt = 0;
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var now = performance.now(), p = local(e);
    if (now - wheelAt < 200) { wheelAcc = 0; return; }
    wheelAcc += e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    if (Math.abs(wheelAcc) < 60) return;
    wheelAt = now; var step = wheelAcc < 0 ? -1 : 1; wheelAcc = 0;
    setLevel(level + step, p[0], p[1]);
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (draft) {
      if (e.key === 'Enter') { e.preventDefault(); finishDraft(); return; }
      if (e.key === 'Escape') { e.preventDefault(); cancelDraft(); return; }
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); draft.pop(); if (!draft.length) draft = null; renderTools(); draw(); setStatus('Точка убрана'); return; }
    }
    // Ctrl+C copies the selected building (its size and turn); Ctrl+V puts a copy under the cursor, or a step away when the cursor is off the map.
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyC') {
      var bl = selList().filter(function (f) { return f.kind === 'building'; });
      if (!bl.length) return;
      e.preventDefault();
      var cx = 0, cy = 0; bl.forEach(function (f) { cx += f.x; cy += f.y; }); cx /= bl.length; cy /= bl.length;
      clip = { cx: cx, cy: cy, n: 0, items: bl.map(function (f) { return { dx: f.x - cx, dy: f.y - cy, w: f.w, h: f.h, rot: f.rot || 0, fl: f.fl || 1 }; }) };
      setStatus(bl.length === 1 ? 'Здание скопировано: ' + metres(bl[0].w) + ' × ' + metres(bl[0].h) + ' м' : 'Скопировано зданий: ' + bl.length); return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyV' && clip) {
      e.preventDefault(); clip.n++;
      var px2 = hoverPx ? wx(hoverPx[0]) : clip.cx + clip.n * 0.03, py2 = hoverPx ? wy(hoverPx[1]) : clip.cy + clip.n * 0.03;
      var made = clip.items.map(function (it) { var nf = { kind: 'building', x: px2 + it.dx, y: py2 + it.dy, w: it.w, h: it.h, rot: it.rot, fl: it.fl }; nf.id = newId(); nf.t = Date.now() + Math.random(); features.push(nf); saveFeat(nf, clip.items.length === 1 ? 'Здание вставлено' : 'Вставлено зданий: ' + clip.items.length); return nf; });
      commit({ group: made.map(function (f) { return { id: f.id, before: null, after: featDoc(f) }; }) });
      if (made.length === 1) { sel = made[0]; multi = []; } else { sel = null; multi = made; }
      setStatus(made.length === 1 ? 'Здание вставлено' : 'Вставлено зданий: ' + made.length); showInfo(); renderTools(); draw(); return;
    }
    if (!build && (e.ctrlKey || e.metaKey || e.key === 'Delete' || e.key === 'Backspace' || e.code === 'KeyR')) return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyZ') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
    if (multi.length > 1 && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); dropMany(multi.slice()); return; }
    if (sel && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); dropFeat(sel); return; }
    if (sel && (sel.kind === 'building' || sel.kind === 'label' || sel.kind === 'bench') && e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); rotateSel(e.shiftKey ? -15 : 15); return; }
    if (e.key === 'Escape') { if (sel || multi.length) select(null); else if (tool) setTool(null); else if (picked) { picked = null; showInfo(); renderTools(); draw(); } return; }
    if (e.key === '+' || e.key === '=') { setLevel(level - 1); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { setLevel(level + 1); e.preventDefault(); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') setLevel(Number(e.key) - 1);
    else if (/^Arrow/.test(e.key)) {
      var d = 80 / view.k;
      if (e.key === 'ArrowLeft') view.x -= d; if (e.key === 'ArrowRight') view.x += d;
      if (e.key === 'ArrowUp') view.y -= d; if (e.key === 'ArrowDown') view.y += d;
      clampView(); draw(); e.preventDefault();
    }
  });

  window.addEventListener('resize', resize);
  document.getElementById('tray').hidden = !build;
  renderMode(); renderTabs(); renderZoom(); showInfo(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { renderTools(); draw(); });

  // ---- Store: "tiles" (one document per square: {on}) and "features" (one document per object). ----
  if (window.claude && window.claude.use) {
    window.claude.use('db').then(function (db) {
      if (!db) { setStatus('Карта не сохраняется в этом просмотре'); return; }
      tilesCol = db.collection('tiles');
      tilesCol.onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v) next[d.id] = { on: v.on === true }; });
        tiles = next; showInfo(); renderTools(); draw();
      }, function () { setStatus('Связь с картой потеряна — обновите страницу'); });
      featCol = db.collection('features');
      featCol.orderBy('t').onSnapshot(function (snap) {
        var held = drag && (drag.type === 'vertex' || drag.type === 'move' || drag.type === 'size' || drag.type === 'peak' || drag.type === 'shape') ? drag.f : null, next = [], keep = null;
        var heldMany = {}; if (drag && drag.type === 'gmove') drag.list.forEach(function (f) { heldMany[f.id] = f; });
        snap.docs.forEach(function (d) {
          if (held && held.id === d.id) { next.push(held); return; }
          if (heldMany[d.id]) { next.push(heldMany[d.id]); return; }
          var f = fromDoc(d.id, d.data()); if (!f) return;
          if (sel && sel.id === d.id) keep = f;
          next.push(f);
        });
        features = next;
        if (sel) sel = held && held === sel ? held : keep;
        if (multi.length) { var ids = {}; multi.forEach(function (m) { ids[m.id] = true; }); var hl = drag && drag.type === 'gmove' ? drag.list : null; multi = hl ? hl : features.filter(function (f) { return ids[f.id]; }); if (multi.length < 2) { sel = multi[0] || null; multi = []; } }
        showInfo(); renderTools(); draw();
      }, function () { setStatus('Связь с картой потеряна — обновите страницу'); });
      setStatus('Подключено');
    });
    window.claude.use('assets').then(function (a) { assetsApi = a || null; if (sel && sel.kind === 'poi') renderTools(); });
  } else setStatus('Карта не сохраняется в этом просмотре');
})();
</script>
