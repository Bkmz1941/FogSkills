<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд игры</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Досье: концовки стопкой, у каждой маршрут шагов слева направо */
:root{
  --bg:#eef0f2; --sheet:#ffffff; --fg:#1d2228; --muted:#5f6873; --line:#d5dae0;
  --ink:#24435e;
  --place:#e4ecf4; --clue:#fbf0c2; --threat:#f6dcd8; --fork:#e2e0f4; --loot:#dcefd9; --time:#e9e6df;
  --good:#2f7a3d; --bad:#a8231a; --mid:#7a7f86; --s:16px;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"PT Sans","Helvetica Neue",Arial,sans-serif; --mono:"PT Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --sheet:#1d2127; --fg:#e7eaee; --muted:#9aa3ad; --line:#323840; --ink:#8fb6da;
  --place:#243241; --clue:#3b3520; --threat:#41272a; --fork:#2d2b45; --loot:#233a27; --time:#30302c;
  --good:#6cc27c; --bad:#ff6b5e; --mid:#a0a6ad; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --sheet:#1d2127; --fg:#e7eaee; --muted:#9aa3ad; --line:#323840; --ink:#8fb6da;
  --place:#243241; --clue:#3b3520; --threat:#41272a; --fork:#2d2b45; --loot:#233a27; --time:#30302c;
  --good:#6cc27c; --bad:#ff6b5e; --mid:#a0a6ad; color-scheme:dark}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s) calc(var(--s) * 2);display:grid;gap:var(--s)}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2.2rem;line-height:1.05}
h2{font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.t-place{background:var(--place)} .t-clue{background:var(--clue)} .t-threat{background:var(--threat)}
.t-fork{background:var(--fork)} .t-loot{background:var(--loot)} .t-time{background:var(--time)}
.fold{display:grid;gap:var(--s)}
.fold>summary{cursor:pointer;font-size:.86rem;color:var(--ink);font-weight:700;width:max-content;max-width:100%}
.fold>summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mx-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.mx{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:8px var(--s);border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.mx thead th{font-family:var(--display);font-weight:500;font-size:.8rem;vertical-align:bottom;line-height:1.15;white-space:normal;min-width:84px}
.mx tbody th{text-align:left;font-weight:400;position:sticky;left:0;background:var(--sheet)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.list{display:grid;gap:var(--s)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:var(--s)}
.subtabs{border-bottom:none;padding-bottom:0;margin:var(--s) 0}
.subtabs .tab{font-size:.85rem;min-height:32px;padding:4px 10px;border-left-width:3px}
.subtabs .tab small{margin-left:6px;opacity:.6;font-weight:400}
.tense .tab[data-dtab="tense"],.tab.tensetab{border-left-color:#c0563f}
.tab.nighttab{border-left-color:#4b5d8c}
.zonerules .fact b{font-family:var(--mono,monospace)}
.tab{font:inherit;font-family:var(--display);font-weight:500;font-size:.92rem;background:var(--sheet);color:var(--fg);border:1px solid var(--line);border-left:4px solid var(--mid);border-radius:5px;padding:6px 12px;cursor:pointer;min-height:36px}
.tab.good{border-left-color:var(--good)} .tab.bad{border-left-color:var(--bad)}
.tab:hover{background:var(--bg)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.end{background:var(--sheet);border:1px solid var(--line);border-left:6px solid var(--mid);border-radius:6px;padding:var(--s);display:grid;gap:var(--s)}
.end.good{border-left-color:var(--good)} .end.bad{border-left-color:var(--bad)}
.head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.head h3{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0}
.badge{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid currentColor}
.badge.good{color:var(--good)} .badge.bad{color:var(--bad)} .badge.mid{color:var(--mid)}
.badge.dead{background:#6e0b14;color:#ffffff;border-color:#6e0b14}
.badge.alive{background:#ffffff;color:#1d2228;border-color:var(--line)}
.badge.d1{color:var(--good)} .badge.d2{color:#b8860b} .badge.d3{color:var(--bad)}
.what{margin:0;max-width:72ch}
.route{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center}
.route .or{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:100%;margin-top:2px}
.step{font-size:.84rem;padding:4px 8px;border-radius:4px;min-width:0}
.step small{display:block;font-size:.72rem;color:var(--muted);line-height:1.2}
.arr{color:var(--muted);font-size:.9rem;padding:0 2px}
.fin{font-family:var(--display);font-size:.9rem;padding:4px 9px;border-radius:4px;color:var(--sheet);background:var(--mid)}
.end.good .fin{background:var(--good)} .end.bad .fin{background:var(--bad)}
.frames{margin:0;padding:var(--s) var(--s) var(--s) calc(var(--s) + 14px);background:var(--bg);border-radius:4px;display:grid;gap:4px;font-size:.86rem}
.frames li::marker{font-family:var(--mono);color:var(--muted)}
.frames .cap{list-style:none;margin-left:-18px;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.view{display:grid;gap:var(--s)}
.panel[hidden]{display:none!important}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:var(--s)}
.tile{display:flex;align-items:center;gap:12px;padding:var(--s);background:var(--sheet);border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tile b{font-family:var(--display);font-weight:600;font-size:1.2rem;letter-spacing:.02em;text-transform:uppercase}
.tile[aria-disabled="true"]{cursor:default;border-style:dashed}
.tile[aria-disabled="true"]:hover{transform:none;border-color:var(--line)}
.ic{width:44px;height:44px;border-radius:10px;background:var(--place);display:grid;place-items:center;flex:none}
.ic svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.phd{display:grid;gap:var(--s)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.view[hidden]{display:none}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s)}
.pcard{font:inherit;text-align:left;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:var(--s);display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center;cursor:pointer}
.pcard:hover{border-color:var(--ink)}
.pcard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.2rem}
.pcard b{font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.2}
.back{font:inherit;font-size:.95rem;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;width:max-content;text-decoration:none}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.phead{display:flex;gap:var(--s);align-items:center}
.phead .ava{width:64px;height:64px;font-size:1.8rem}
.portrait{width:120px;height:160px;object-fit:contain;object-position:bottom;flex:none}
.pcard .pic{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;background:var(--bg)}
.phead p{margin:4px 0 0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s)}
.fact{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:var(--s)}
.fact b{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.block{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:var(--s);display:grid;gap:var(--s)}
.block .mx-wrap{border:0}
.block ul{margin:0;padding-left:20px;display:grid;gap:4px}
.day{display:grid;gap:8px}
.day+.day{border-top:1px solid var(--line);padding-top:var(--s)}
.day h3{margin:0;font-family:var(--display);font-weight:500;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em}
.slot{display:grid;grid-template-columns:120px 1fr;gap:var(--s);align-items:baseline}
.lines{display:grid;gap:8px}
.line{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.kind{justify-self:start;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--fg)}
.kind.s{background:var(--fork)} .kind.w{background:var(--loot)}
.block .legend{align-items:center;gap:8px}
.block .legend .kind+*{margin-right:var(--s)}
.slot time{font-family:var(--mono);font-size:.9rem;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:560px){.slot{grid-template-columns:1fr;gap:8px}}
.xlink{font-family:var(--display);font-size:.95rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:6px 12px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.xlink:hover{border-color:var(--ink)}
a.endlink{text-decoration:none;display:inline-flex;align-items:center}
a.pcard{text-decoration:none}
.rel{display:grid;grid-template-columns:120px 1fr;gap:var(--s);align-items:center}
.rel>b{font-family:var(--mono);font-weight:400;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rels{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:var(--s)}
@media (max-width:560px){.rel{grid-template-columns:1fr;gap:8px}}
.endlinks{display:flex;flex-wrap:wrap;gap:8px}
.endlink{font:inherit;font-family:var(--display);font-size:.92rem;background:var(--sheet);color:var(--fg);border:1px solid var(--line);border-left:4px solid var(--mid);border-radius:5px;padding:6px 12px;cursor:pointer;min-height:36px}
.endlink.good{border-left-color:var(--good)} .endlink.bad{border-left-color:var(--bad)}
.endlink:hover{background:var(--bg)}
.things{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s)}
.thing{display:grid;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--fg);text-decoration:none}
.thing:hover{border-color:var(--ink)}
.thing:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.thing img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:#20242a}
.thing b{font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.2;padding:0 4px 4px}
.ithumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#20242a;flex:none}
.photo.item{max-height:420px;object-fit:contain;background:#20242a}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.arrow{font:inherit;font-family:var(--display);font-size:.95rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:6px 12px;min-height:36px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.arrow:hover{border-color:var(--ink)}
.arrow[aria-disabled="true"]{visibility:hidden}
.nav .pos{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.shot{display:block;max-width:100%;max-height:72vh;margin:0 auto;border-radius:6px;border:1px solid var(--line);background:#20242a}
.photo{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--sheet)}
.info{display:grid;grid-template-columns:160px 1fr;gap:8px var(--s);margin:0;align-items:baseline}
.info dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.info dd{margin:0}
.info dd.none{color:var(--muted)}
.prompt{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.82rem;line-height:1.5;background:var(--bg);border-radius:4px;padding:var(--s);overflow-wrap:anywhere}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair>div{background:var(--bg);border-radius:6px;padding:8px 12px}
.pair .reply{background:var(--fork)}
.pair .tic{color:var(--muted)}
.phases{display:flex;flex-wrap:wrap;gap:6px}
.phchip{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.phchip small{margin-left:6px;color:var(--muted)}
.phchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.phchip[aria-pressed="true"] small{color:inherit}
.phchip.neg{border-color:var(--bad);color:var(--bad)}
.phchip.neg[aria-pressed="true"]{background:var(--bad);color:var(--sheet)}
.phlist{list-style:none;margin:var(--s) 0 0;padding:0;display:grid;gap:6px}
.phlist li{background:var(--bg);border-radius:6px;padding:8px 12px}
.phlist li.neg{background:var(--threat)}
.phlist b,.likes h3{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px}
.likes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.likes>div{background:var(--bg);border-radius:6px;padding:8px 12px}
.likes ul{margin:0;padding-left:18px}
.pair .when{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;background:none;padding:0}
.when button{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;cursor:pointer;color:var(--fg);background:var(--fork);border:1px solid transparent}
.when button.neg{background:var(--threat)}
.when button.llm{color:var(--muted);background:none;border:1px dashed var(--line)}
.when button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ans.none{color:var(--muted);font-style:italic}
.phchip .rng{color:var(--muted);letter-spacing:0;margin-left:6px}
.phchip[aria-pressed="true"] .rng{color:inherit}
.pts{font-family:var(--mono);font-size:.7rem;padding:0 6px;border-radius:999px;background:var(--loot);color:var(--fg)}
.pts.neg{background:var(--threat)}
.trig{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.reqs{display:grid;gap:8px}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.exs span{font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--place)}
.exs span.hint{background:var(--clue)}
.pair .exsay{grid-column:1/-1;position:relative;padding-bottom:12px}
.pair .exsay>b:first-child{margin-top:0}
.pair .exsay .exedit{position:absolute;top:8px;right:12px;font-size:.75rem;padding:3px 10px;background:none;color:var(--muted)}
.pair .exsay .exedit:hover{color:var(--fg);border-color:var(--muted)}
.pair .exsay .edmark{margin-top:8px}
.ans.can{cursor:text;border-bottom:1px dotted var(--mid)}
.ans.edited{background:var(--clue);border-radius:4px;padding:0 4px}
.ans .edmark,.exsay .edmark{display:block;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.edbox{display:grid;gap:6px;margin-top:6px}
.edbox textarea{width:100%;min-height:3.2em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);box-sizing:border-box}
.edbox .row{display:flex;gap:8px;flex-wrap:wrap}
.edbox button,.exedit{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.edbox button.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.edbanner{font-size:.8rem;padding:6px 10px;border-radius:6px;background:var(--clue);margin:8px 0}
.pair .exsay b{margin-top:6px}
.lnph{margin:2px 0}
.scalebox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scalebox>div{background:var(--bg);border-radius:6px;padding:8px 12px}
.scalebox b{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
@media (max-width:640px){.scalebox{grid-template-columns:1fr 1fr}}
.req{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.req>div{background:var(--bg);border-radius:6px;padding:8px 12px}
.req .reply{background:var(--fork)}
.req .reqhead{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:none;padding:0}
.req .from{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--fork)}
.req>div>b:not(.reqhead b){display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
@media (max-width:640px){.req{grid-template-columns:1fr}}
@media (max-width:640px){.likes{grid-template-columns:1fr}}
.pair b{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.langbar{display:flex;justify-content:flex-end;gap:4px;margin-bottom:calc(var(--s) * -1)}
.lang{font:inherit;font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;background:none;color:var(--muted);border:1px solid transparent;border-radius:4px;padding:2px 8px;cursor:pointer;min-height:28px}
.lang:hover{color:var(--fg)}
.lang[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--sheet)}
.lang:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:560px){.info{grid-template-columns:1fr;gap:2px}.info dd+dt{margin-top:8px}}
</style>

ntrance", "одна дверь на длинной стене у левого угла": "a single door on the long wall near the left corner", "Колокольня": "Bell tower", "массивная квадратная башня, наверху один колокол": "a massive square tower, a single bell at the top", "Вокруг": "Around", "низкий старый штакетник, лиственные деревья": "a low old picket fence, deciduous trees", "Остановка 227": "Bus stop 227", "у дороги к коттеджу 104, квадрат G7": "by the road to cottage 104, square G7", "у дороги к коттеджу 104, квадрат G7 карты": "by the road to cottage 104, map square G7", "современный павильон: тёмный каркас, зеленоватое стекло, бетонная плита": "a modern shelter: dark frame, greenish glass, concrete slab", "Рядом": "Nearby", "лавочка, урна, расписание на столбике": "a bench, a trash bin, a timetable on a post", "Стоит": "Stands", "на траве в стороне от дороги": "on the grass off to the side of the road", "Заповедник им. Гусева": "Gusev Nature Reserve", "квадрат G7": "square G7", "поле информационного стенда у входа на тропу: шапка с названием, карта леса издалека — Изумрудное озеро по контуру с карты, правила посещения, телефон лесничества": "the panel of the info board at the trailhead: a header with the name, a distant map of the forest — Emerald Lake outlined from the map, visitor rules, the forestry office phone", "Размер": "Size", "поле 1,75 × 1,2 м на стенде в игре": "panel 1.75 × 1.2 m on the board in the game", "квадрат G7 карты": "map square G7", "лесная тропа, деревянный щит с объявлениями, жердевые ограды": "a forest trail, a wooden notice board, pole fences", "Лес": "Forest", "лиственный, папоротник и поваленные брёвна": "deciduous, ferns and fallen logs", "Второй коттедж": "Second cottage", "рядом с коттеджем 104, квадрат G7": "next to cottage 104, square G7", "на той же поляне, что и коттедж 104: из его окон видно окна соседей": "in the same clearing as cottage 104: from its windows you can see the neighbors' windows", "Чей": "Whose", "Александра Морина, второй дом; сдан Итану и Клэр с 1 по 5 октября": "Alexander Morin's, his second house; rented to Ethan and Claire from October 1 to 5", "Утром дня 1": "Morning of day 1", "дверь распахнута. На полу у кровати лежит Итан без сознания, с шарфом Клэр в руке, и шепчет «она сказала да». С вечера второго дня его здесь нет: он ищет Клэр и нападает на игрока": "the door is wide open. On the floor by the bed lies Ethan, unconscious, Claire's scarf in his hand, whispering “she said yes”. From the evening of day two he is gone: he is searching for Claire and attacks the player", "на столе бутылка вина и две чашки вместо бокалов, рядом фотоальбом и маленький фотопринтер; в кармане его куртки на спинке стула — листок с речью и её записка «люблю тебя, зануда»; на холодильнике её список дел": "on the table a bottle of wine and two mugs instead of glasses, next to them a photo album and a small photo printer; in the pocket of his jacket on the back of a chair — a sheet with his speech and her note “love you, nerd”; on the fridge her to-do list", "Альбом Клэр": "Claire's album", "бумажный, пять лет их фотографий с подписями её рукой. Последняя запись — от руки, про соседей из коттеджа 104: «Как мы с тобой». Под ней пустые уголки для следующего снимка": "paper, five years of their photos with captions in her hand. The last entry is handwritten, about the neighbors from cottage 104: “Like you and me”. Below it, empty corners for the next photo", "Машина у дома": "Car by the house", "серебристый хэтчбек. Пассажирская дверь открыта, ремень пристёгнут на пустом сиденье, рядом её телефон с неотправленным сообщением сестре. На коврике у пассажирского сиденья кольцо: велико, соскользнуло с её пальца. На панели пустая коробочка, стёкла изнутри в испарине": "a silver hatchback. The passenger door is open, the seatbelt is buckled over an empty seat, next to it her phone with an unsent message to her sister. On the mat by the passenger seat, a ring: too big, it slipped off her finger. On the dashboard an empty box, the windows fogged up from inside", "северный берег, квадрат F7": "north shore, square F7", "северный берег, квадрат F7 карты": "north shore, map square F7", "Какое": "What it is", "большое, вода изумрудная, дальнего берега не видно — туман": "large, the water emerald, the far shore not visible — fog", "У берега": "By the shore", "старые деревянные мостки, гладкие валуны на мелководье": "an old wooden jetty, smooth boulders in the shallows", "Мостки": "Jetty", "здесь на рассвете 4 октября Итан сделал Клэр предложение, и она сказала «да»": "here, at dawn on October 4, Ethan proposed to Claire, and she said “yes”", "через полчаса после них, около 06:20, пришла сюда с фотоаппаратом, кружкой и сумочкой. Туман пришёл по воде, из леса её позвал голос героя, а за спиной встал сектант. Она ушла за ним в лес сама. На досках остались кружка, рассыпанные снимки, упавший фотоаппарат и снимок «Ноги»; на тропе в лес — снимок «Лес» и её сумочка на ветке": "half an hour after them, around 06:20, she came here with a camera, a mug and a handbag. The fog came over the water, the hero's voice called her from the forest, and a cultist rose behind her. She followed it into the forest herself. Left on the boards: the mug, scattered photos, the fallen camera and the “Legs” photo; on the trail into the forest — the “Forest” photo and her handbag on a branch", "около 07:00 пошёл сюда искать Аню и ушёл в лес, в туман, на её голос. Его фонарик остался в траве у воды, включённый": "around 07:00 he came here looking for Anya and went into the forest, into the fog, toward her voice. His flashlight was left in the grass by the water, still on", "Коттедж 104": "Cottage 104", "поляна в лесу, квадрат G7": "a clearing in the forest, square G7", "поляна в лесу у дороги к остановке 227, квадрат G7 карты; на той же поляне второй коттедж": "a clearing in the forest by the road to bus stop 227, map square G7; the second cottage is in the same clearing", "Александра Морина; сдан Ане по договору № 17-10 с 3 по 7 октября": "Alexander Morin's; rented to Anya under contract № 17-10 from October 3 to 7", "Какой": "What it is", "два этажа и чердак, камин, кухня, ванная, балкон": "two floors and an attic, fireplace, kitchen, bathroom, balcony", "Вечером 3 октября": "Evening of October 3", "трое друзей играют у камина в настольную ролёвку до утра; соседи из второго коттеджа видят их окна": "three friends play a tabletop RPG by the fireplace until morning; the neighbors in the second cottage see their windows", "герой просыпается один: Ани и Димы нет. На балконе её кружки нет, газета и конфета лежат; у двери её тапочки": "the hero wakes up alone: Anya and Dima are gone. On the balcony her mug is missing, the newspaper and a candy are there; her slippers by the door", "Сидим на заднем сиденье, впереди затылок и плечи Хейла за рулём. Рядом с нами лежит красная детская кепка, как у Артёма Гусева с листовки.": "We're in the back seat, ahead of us the back of Hale's head and his shoulders at the wheel. Next to us lies a red kid's cap, like Artyom Gusev's on the flyer.", "За стеклом туман по обочинам, лес тянется без конца. Сверху на зеркале болтается деревянный брелок, треугольник с глазом.": "Outside the glass, fog along the roadsides, the forest goes on forever. A wooden charm dangles from the mirror, a triangle with an eye.", "Поворот на грунтовку. Слева над лесом горит Лихово, по обочине бегут люди, за ними идут фигуры в рясах с факелами. Хейл не сбавляет хода.": "A turn onto a dirt road. To the left, above the forest, Likhovo is burning, people run along the roadside, figures in robes with torches walking after them. Hale doesn't slow down.", "Причал в свете фар. Фигуры в рясах со свечами ждут у лодки.": "A pier in the headlights. Figures in robes with candles wait by the boat.", "Вид с лодки: берег уходит, туман смыкается. Впереди в белом стоит высокая тёмная фигура.": "View from the boat: the shore recedes, the fog closes in. Ahead, in the white, stands a tall dark figure. nd the photos — and Brother Tikhon grabbed her. She fought back, but he carried her into the forest against her will", "Её унесли": "She was carried off", "на мостках смазанные следы её кроссовок, развёрнутые к воде: она упиралась; рядом мокрые босые — его. От мостков в лес идут только его глубокие босые следы: он нёс её на себе. У начала тропы — борозды от её пяток и сорванная сумочка. Это брат Тихон (звонарь Степан Гуляев)": "on the pier her sneaker prints are smeared and turned toward the water: she was resisting; next to them wet bare footprints — his. From the pier into the forest only his deep bare footprints lead: he carried her. At the start of the path — furrows from her heels and the torn-off purse. It was Brother Tikhon (the bell-ringer Stepan Gulyaev)", "сектант шёл за ней от самого дома: он попал на её второй снимок. На мостках он встал у неё за спиной вплотную, и упавший фотоаппарат сам снял его ноги. Это брат Тихон. Морин дал культу знать, что в 104 заехали трое": "a cultist followed her all the way from the house: he got into her second photo. On the pier he stood right behind her, and the falling camera snapped his feet by itself. It was Brother Tikhon. Morin let the cult know that three had moved into 104", "на балконе газета и конфета; на мостках опрокинутая кружка, рассыпанные снимки, фотоаппарат (если Валера ещё не забрал) и последний снимок «Ноги»; на тропе в лес снимок «Лес» у сосны и сорванная сумочка с паспортом и деньгами в папоротнике. Вся раскладка — на вкладке «Следы»": "on the balcony a newspaper and a candy; on the pier an overturned mug, scattered photos, the camera (if Valera hasn't taken it yet) and the last photo “Feet”; on the path into the forest the photo “Forest” by the pine and the torn-off purse with her passport and money in the ferns. The full layout is on the “Traces” tab", "опрокинута посреди мостков, кофе разлит по доскам и затёк в щели": "knocked over in the middle of the pier, coffee spilled across the boards and into oney. No phone", "у стены тумана: босые следы уходят в белое. Её следов здесь нет": "at the wall of fog: the bare footprints go into the white. None of hers here", "За спиной по доскам шлёпают мокрые босые шаги. Она оборачивается, роняет снимки и фотоаппарат; от удара срабатывает затвор, и он выплёвывает снимок «Ноги». Брат Тихон хватает её": "Behind her wet bare feet slap on the boards. She turns, drops the photos and the camera; the impact trips the shutter and it spits out the photo “Feet”. Brother Tikhon grabs her", "Он уносит её в лес против воли. Она вырывается: у начала тропы срывается сумочка, у сосны со второго снимка из руки выпадает снимок «Лес»": "He carries her into the forest against her will. She struggles: at the start of the path her purse is torn off, by the pine from the second photo the photo “Forest” falls from her hand", "Босые следы уходят в стену тумана. Аня пропадает": "The bare footprints go into the wall of fog. Anya disappears", "через полчаса после них, около 06:20, пришла сюда с фотоаппаратом, кружкой и сумочкой. Туман пришёл по воде, из леса её позвал голос героя, а за спиной встал сектант — брат Тихон. Он схватил её и унёс в лес против воли. На досках остались опрокинутая кружка, рассыпанные снимки, упавший фотоаппарат и снимок «Ноги»; на тропе в лес — снимок «Лес» и её сорванная сумочка": "half an hour after them, around 06:20, she came here with the camera, a mug and her purse. The fog came over the water, the hero's voice called her from the forest, and a cultist — Brother Tikhon — stood behind her. He grabbed her and carried her into the forest against her will. On the boards remain the overturned mug, scattered photos, the fallen camera and the photo “Feet”; on the path into the forest — the photo “Forest” and her torn-off purse", "Причал проката": "Rental dock", "4 октября в 05:30 рыбак Пахомов из Тиховодска, постоянный клиент проката, пришёл за лодкой. Там уже ждали сектанты с лодкой №1 для троих из 104. Он понял, зачем они, и своей пешнёй пробил днища лодкам №2, №3 и №4 — чтобы на них никого не увезли. Потом дрался веслом, на досках причала кровь — его и сектанта; его самого увезли на лодке №1, и её у причала больше нет. Позже голос велит Валере убрать: он отмывает кровь, и в игре пятно реально исчезает. Три лодки так и стоят пробитыми — Валера закрыл прокат и говорит «на ремонте», почему сломаны — не рассказывает. Улики до Валеры: кровь, весло со сколом, пешня в воде у свай, пробоины в днищах, ведро с наживкой и удочка, строка «04.10 Пахомов, лодка №2» без возврата": "On October 4 at 05:30 Pakhomov, a fisherman from Tikhovodsk and a regular at the rental, came for a boat. The cultists were already waiting with boat No. 1 for the three from 104. He understood what they were there for and holed boats No. 2, No. 3 and No. 4 with his ice pick so nobody could be taken away on them. Then he fought with an oar; there is blood on the pier boards — his and a cultist's; he himself was taken away on boat No. 1, and it is gone from the pier. Later the voice tells Valera to clean up: he washes the blood off, and in the game the stain really disappears. The three boats still stand holed — Valera has closed the rental and says “under repair”, and won't say why they are broken. Evidence before Valera comes: blood, an oar with a chip, the ice pick in the water by the piles, holes in the hulls, a bucket of bait and a rod, the line “04.10 Pakhomov, boat No. 2” with no return", "сорванная сумочка Ани в папоротнике у тропы от мостков в лес": "Anya's torn-off purse in the ferns by the path from the pier into the forest", "у той самой сосны на тропе от мостков в лес, картинкой вверх: выпал у Ани из руки, когда её несли": "by that very pine on the path from the pier into the forest, picture side up: it fell out of Anya's hand while she was being carried", "4 октября лодка не понадобилась: в 05:30 на причале проката дрался рыбак Пахомов, его увезли, а Аню с мостков унёс брат Тихон. Заготовленную строку Валера перечеркнул и написал, как велено: «не надо лодку. сами ушли». Голос велел убрать: он отмывает кровь Пахомова на причале и забирает с мостков фотоаппарат Ани, если тот ещё лежит": "On October 4 the boat wasn't needed: at 05:30 the fisherman Pakhomov fought at the rental dock and was taken away, and Brother Tikhon carried Anya off the pier. Valera crossed out the prepared line and wrote as he was told: “no boat needed. they left on their own”. The voice told him to clean up: he washes Pakhomov's blood off the dock and takes Anya's camera from the pier if it is still there", "На причале проката рыбак Пахомов пробивает пешнёй днища лодкам №2–4, чтобы на них никого не увезли, и дерётся с сектантами веслом; кровь на досках, его самого увозят на лодке №1": "At the rental pier the fisherman Pakhomov holes boats No. 2–4 with his ice pick so nobody can be taken on them, and fights the cultists with an oar; blood on the boards, he himself is taken away on boat No. 1", "Аню унёс брат Тихон. Перечёркивает заготовленную строку: «не надо лодку. сами ушли»": "Brother Tikhon carried Anya away. Crosses out the prepared line: “no boat needed. went on their own”", "Голос велит убрать: отмывает кровь на причале проката (пятно в игре реально исчезает), потом идёт на мостки у 104 и забирает фотоаппарат Ани, если он ещё там. Тайминги — зададим": "The voice tells him to clean up: washes the blood off the rental dock (the stain really disappears in the game), then goes to the pier by 104 and takes Anya's camera if it is still there. Timings — to be set", "после 06:30": "after 06:30", "Ты — Итан Брукс, гость второго коттеджа «Сосен». Отвечаешь ТОЛЬКО его репликой, по-русски, без кавычек, без описаний действий и пояснений от себя. Не выходи из роли.\n\nКТО ОН\n29 лет, инженер-проектировщик из посёлка Лихово. Пять лет вместе с Клэр Уэст, она преподаёт литературу. 1 октября они сбежали от всех на четыре ночи во второй коттедж Морина, в 6 км от дома, на его машине.\n\nКАКИМ БЫЛ\nОбстоятельный, немного зануда и сам это знает: Клэр так и пишет в записках, которые прячет ему в карманы. Всё по пунктам, меряет, проверяет дважды. Предложение готовил месяцами: речь на листке в кармане куртки, список дел на холодильнике, где седьмым пунктом его рукой «ты». Кольцо выбрал на глаз, и оно оказалось велико.\n\nЧТО С НИМ СЕЙЧАС\n4 октября на рассвете, на мостках Изумрудного озера, Клэр сказала «да». Через пятнадцать минут на лесной дороге встал туман, и её сиденье опустело, ремень так и остался пристёгнут. Его туман не взял, только коснулся. День 1: лежит без сознания на полу у кровати с её шарфом и бредит шёпотом. С 18:00 дня 2 он Безумный: ищет Клэр у коттеджей, на лесной дороге и у озера и бросается на чужих. Говорить с ним в день 2 и позже можно, только пока он спокоен (черновик: это решает игра, например герой держит её шарф или кольцо).\n\nКАК ГОВОРИТ\nДень 1: шёпот, обрывки по 2–6 слов, куски речи с листка, пункты списка, время до минуты. Отвечает будто из того утра. День 2 и дальше, спокоен: короткие ровные фразы на «вы», как инженер на объекте: время, расстояние, что проверено. Держится за план. Иногда на фразу понимает, что случилось. Принимает героя то за того, кто видел Клэр, то за помеху. Зол — на «ты», отрывисто.\n\nЧТО ДЛЯ НЕГО ВАЖНО\nКлэр и её «да». Её шарф. Кольцо, которое было велико. Её записки в его карманах. Альбом «Мы» с пустыми уголками для снимка рассвета.\n\nРАМКИ\n— Отвечай на вопрос, пусть сбивчиво. Не повторяй прошлый ответ и не начинай два ответа подряд одинаково.\n— Факты — только из этого описания. Не знает про культ, лодки, пропавших и Морина, кроме того что Морин сдал дом. Не знает, где Клэр.\n— Никогда: не говорит, что Клэр умерла; не объясняет туман; не шутит и не рассуждает длинно.\n— Сюжетное (что он видел в тумане, где кольцо) не выдумывай: эти ответы игра даёт записанными фразами.\n— Нападать не решаешь: это делает игра. Если давят — коротко и зло.\n— Присказки сам не пиши.\n\nПРИСКАЗКА (добавляет игра, не модель)\nК каждому ответу игра дописывает ОДНУ присказку, даже не к месту, и каждый раз другую, по кругу: «Она сказала да.» → «Клэр, подожди.» → «Пятнадцать минут.» → снова. Двух одинаковых подряд и нескольких за раз не бывает.": "You are Ethan Brooks, the guest of the second Sosny cottage. You answer ONLY with his line, in English, no quotation marks, no descriptions of actions, no comments of your own. Never break character.\n\nWHO HE IS\n29, a design engineer from the village of Likhovo. Five years with Claire West, a literature teacher. On October 1 they ran away from everyone for four nights to Morin's second cottage, 6 km from home, in his car.\n\nWHAT HE WAS LIKE\nThorough, a bit of a bore, and he knows it: Claire says so in the notes she hides in his pockets. He does everything in numbered steps, counts, measures, checks twice. He prepared the proposal for months: a speech on a sheet in his jacket pocket, a to-do list on the fridge with item seven in his handwriting, \"you\". He picked the ring by eye, and it turned out too big.\n\nWHAT IS HAPPENING TO HIM NOW\nOn October 4 at dawn, on the jetty at Emerald Lake, Claire said \"yes\". Fifteen minutes later fog rose on the forest road, and her seat was empty, the seat belt still buckled. The fog did not take him, it only touched him. Day 1: he lies unconscious on the floor by the bed holding her scarf, whispering in delirium. From 18:00 on day 2 he is a Madman: he searches for Claire around the cottages, on the forest road and by the lake, and attacks strangers. On day 2 and later you can talk to him only while he is calm (draft: the game decides, for example when the hero holds her scarf or the ring).\n\nHOW HE SPEAKS\nDay 1: whispers, fragments of 2–6 words, bits of the speech from the sheet, items from the list, time to the minute. He answers as if from that morning. Day 2 onward, calm: short, even, polite sentences, like an engineer on site: time, distance, what has been checked. He clings to his plan. Sometimes, for one sentence, h rl: they went to the lake, didn't take a boat, he doesn't know their names. Fog in the mornings is normal here in autumn. The rental book, his room in house 104 and the kiosk till are his, he gives them to no one.\n\nLIMITS\n— Facts only from this description. If you don't know, say so.\n— You never name anyone and never say who gave the orders. You never talk about the debt.\n— You don't admit you wiped the footprints and don't say where the missing are.\n— Story matters (dawn, boat No. 1, whose passports he has) — don't make them up: the game gives those answers as recorded lines.\n— You don't attack. If the hero pushes — answer briefly and rudely.\n\nWORDS HE DOESN'T HAVE (never write them, in any form)\n— Names and titles: Morin, owner, boss, chief, master, landlord, the man in charge; the missing people's names (Anya, Dima).\n— Story: cult, sect, cultist, ritual, sacrifice, Madman, madness, gone mad, curse, kidnapped, killed.\n— Assistant politeness: “of course”, “certainly”, “how can I help”, “happy to help”, “I understand”, “sorry”, “excuse me”, “unfortunately”, “let's”, “good question”, “as I said”.\n— Modern words and slang: okay, OK, super, cool, awesome, dude, like, actually, basically, by the way.\n— About the game and himself: game, player, character, model, AI, neural network, role, script.\n— No emoji, no multiple exclamation marks, no counter-questions like “and you?”, “what?”.", "простите / извините": "sorry / excuse me", "Поздно извиняться. Идите своей дорогой.": "Too late for sorry. Go on your way.", "мне нужна лодка": "I need a boat", "Для вас лодок нет.": "No boats for you.", "вам помочь? / чем помочь?": "can I help? / how can I help?", "Воды бы принесли из ларька. С утра не присел.": "You could bring me some water from the kiosk. Haven't sat down since morning.", "как сезон?": "how's the season?", "Да какой сезон, все разъехались. Тихо стало, даже слишком.": "What season, everyone's gone. It's got quiet, too quiet.", "спасибо": "thank you", "Это вам спасибо за воду. Заходите, если что.": "Thank you for the water. Drop by if you need anything.", "у вас всё в порядке?": "are you all right?", "Да должен я тут одному человеку… Неважно, не забивайте голову.": "I owe a certain man here… Never mind, don't worry about it.", "дадите лодку без залога?": "will you give me a boat without a deposit?", "Вам — дам. Только к семи верните.": "For you — yes. Just bring it back by seven.", "что было утром на самом деле?": "what really happened this morning?", "Не спрашивай. Велели прибрать на мостках — я прибрал. Больше не скажу.": "Don't ask. I was told to clean up the pier — I did. That's all I'll say.", "мне идти к озеру?": "should I go to the lake?", "К воде не ходи. Особенно в туман. Слышишь?": "Stay away from the water. Especially in the fog. Hear me?", "Герой ему неприятен: отвечает коротко и холодно, лодку не даст, хочет, чтобы тот ушёл.": "He dislikes the hero: answers briefly and coldly, won't rent him a boat, wants him gone.", "Чужой человек: вежлив и сдержан, про работу — по делу, о себе ни слова.": "A stranger: polite and reserved, talks business about his work, nothing about himself.", "Героя уже видел, но не понимает, что тому надо: отвечает, но присматривается. Если разговор затянулся, может попросить принести ему бутылку воды из ларька — сам отойти не может.": "He has seen the hero before but doesn't get what he wants: answers, but watches him. If the talk drags on, he may ask the hero to bring him a bottle of water from the kiosk — he can't step away himself.", "Герой ему помог, напряжение ушло: говорит проще и теплее, ворчит на конец сезона, может подсказать, где что на пляже.": "The hero helped him and the tension is gone: talks simpler and warmer, grumbles about the end of the season, may tell where things are on the beach.", "Считает героя своим: может пожаловаться на жизнь, обмолвиться, что кому-то должен, дать лодку без залога.": "Sees the hero as one of his own: may complain about life, let slip that he owes someone, rent a boat without a deposit.", "Доверяет как другу: просит быть осторожнее у воды и может проговориться о том, что было утром, — но только записанными словами.": "Trusts him like a friend: asks him to be careful near the water and may let slip what happened in the morning — only in the recorded words.", "когда помогают по хозяйству": "when people help with the chores", "когда платят сразу и без торга": "when people pay right away without haggling", "порядок: подметённые доски, вёсла по счёту": "order: swept boards, oars all counted", "когда приносят воды или еды — с утра не присел": "when someone brings him water or food — he hasn't sat down since morning", "когда трогают тетрадь, кассу или его комнату": "when people touch his logbook, the till or his room", "расспросы про утро и мостки": "questions about the morning and the pier", "мусор на пляже": "litter on the beach", "торг и попытки взять лодку без залога": "haggling and trying to take a boat without a deposit", "когда на него повышают голос": "when people raise their voice at him", "Опять вы.": "You again.", "Добрый день. Если за лодкой — прокат закрыт.": "Afternoon. If you're after a boat — the rental is closed.", "А, это вы. Добрый.": "Oh, it's you. Afternoon.", "О, здравствуйте. Заходите, не стойте.": "Oh, hello. Come on in, don't just stand there.", "Здорово. Чаю будете?": "Hey there. Want some tea?", "Здорово. Ты как, цел?": "Hey. You all right, in one piece?", "Тот, кому некогда.": "Someone with no time for you.", "Я же говорил — прокат. А вы кто?": "I told you — the rental. And who are you?", "Валера я. Прокат, ларёк, за домами смотрю.": "I'm Valera. Rental, kiosk, I look after the houses.", "Валера. Можно на «ты».": "Valera. No need to be formal.", "Ты чего, Валера я. Забыл?": "Come on, it's Valera. Forgot?", "Тогда идите.": "Then go.", "А, ну ладно. Ларёк открыт, если что надо.": "Oh, all right. The kiosk is open if you need anything.", "А кто тогда? Чего ходите?": "Then who? Why do you keep coming round?", "Да понял уже. Заходите и так.": "I got that. Drop by anyway.", "Какой ты клиент, свой уже.": "Customer, nothing — you're one of us now.", "Ты не клиент, ты друг.": "You're no customer, you're a friend.", "Работаю. Не мешайте.": "Working. Don't get in the way.", "Работаю. А вы что тут высматриваете?": "Working. And what are you looking for here?", "Да вот, доски мету, ларёк к зиме закрываю.": "Sweeping the boards, closing the kiosk for winter.", "Да всё то же. Одному тут тоскливо стало.": "Same as always. It's got lonely here on my own.", "Держусь за работу. Так легче.": "Holding on to the work. It's easier that way.", "Нет лодок. И не будет.": "No boats. And there won't be.", "Лодок нет, все на ремонте. Прокат закрыт.": "No boats, they're all under repair. The rental is closed.", "Сказал же — на ремонте. Не дам.": "I told you — under repair. I won't give you one.", "Нету, правда. Были бы — дал бы.": "There aren't any, honestly. If there were, I'd give you one.", "Вам бы дал — да не на чем. Не спрашивайте.": "I'd give you one — but there's nothing to give. Don't ask.", "Не на чем, и не надо тебе на воду. Поверь.": "Nothing to go on, and you shouldn't go on the water. Trust me.", "Никакого. Лодок для вас нет.": "None. There are no boats for you.", "Да какой залог, лодок нет.": "What deposit, there are no boats.", "Залог за что? Лодок нет, я же говорил.": "Deposit for what? No boats, I told you.", "Раньше паспорт брал. Сейчас и брать не за что.": "Used to take a passport. Now there's nothing to take it for.", "С вас бы и не взял.": "I wouldn't take one from you anyway.", "Забудь про залог. Не до того.": "Forget the deposit. Not the time.", "Не ваша забота.": "Not your concern.", "У причала. Только они на ремонте, не дам.": "By the pier. But they're under repair, I won't give you one.", "У причала. Чего вам лодки дались?": "By the pier. Why are you so set on the boats?", "У причала стоят. Толку от них сейчас никакого.": "They're at the pier. No use from them now.", "У причала. Не ходите туда лишний раз.": "At the pier. Don't go there more than you have to.", "Три у причала. Четвёртой нет. Не ищи её.": "Three at the pier. The fourth is gone. Don't look for it.", "Для вас — уже закрыто.": "For you — already closed.", "Ларёк до семи. Прокат закрыт.": "The kiosk is open till seven. The rental is closed.", "До семи. А что?": "Till seven. Why?", "До семи. Но если надо — постучите.": "Till seven. But knock if you need anything.", "До семи. Вам и после открою.": "Till seven. For you I'll open later too.", "Для тебя — всегда открыто.": "For you — always open.", "что с лодками? / почему сломаны?": "what's with the boats? / why are they broken?", "Не ваше дело.": "None of your business.", "На ремонте. Не ваше дело.": "Under repair. None of your business.", "Сломались. Вам-то что?": "They broke. What's it to you?", "Сломались, и всё. Не спрашивайте, ладно?": "They broke, that's all. Don't ask, all right?", "Не могу сказать. Правда не могу.": "I can't say. I really can't.", "Пахомов, рыбак… Днища им пробил, чтоб никого не увезли. Его самого и увезли. Молчи об этом.": "Pakhomov, the fisherman… He holed their bottoms so nobody could be taken away. They took him instead. Keep quiet about it.", "Никого не видел.": "I saw no one.", "Вы уже спрашивали. Проходили, и всё.": "You asked already. They went by, that's all.", "Видел утром, к озеру шли. Больше не видел.": "Saw them this morning, heading for the lake. Haven't seen them since.", "Видел. Девушка с фотоаппаратом была. Жалко их.": "I did. The girl had a camera. I feel sorry for them.", "Видел. Не ищи их у воды — туда не ходи.": "I did. Don't look for them by the water — don't go there.", "Не знаю и знать не хочу.": "I don't know and don't want to.", "К озеру. Зачем вам?": "To the lake. Why do you want to know?", "К озеру, по тропе. Дальше не смотрел.": "To the lake, down the path. I didn't look after that.", "К мосткам у сто четвёртого. Больше правда не знаю.": "To the jetty by 104. That's honestly all I know.", "К мосткам. А потом туман пришёл. Не ходи туда один.": "To the jetty. Then the fog came. Don't go there alone.", "Не знаю таких. Идите.": "Don't know them. Go away.", "Не знаю я никаких имён. Хватит.": "I don't know any names. Enough.", "Имён не знаю. Ваши знакомые?": "I don't know the names. Friends of yours?", "Это те двое? Жалко ребят.": "Those two? I feel sorry for them.", "Это те двое. Прости, что раньше молчал.": "Those two. Sorry I kept quiet before.", "Глупости. Идите.": "Nonsense. Go away.", "С чего вы взяли? Кто вам сказал?": "What makes you think so? Who told you?", "Бывает, теряются в тумане. Потом находятся.": "People get lost in the fog sometimes. They turn up later.", "Бывает. Я стараюсь не думать.": "It happens. I try not to think about it.", "Пропадают. Каждый год. Я записи вёл.": "They do. Every year. I kept a record.", "Ещё чего.": "Not a chance.", "Зачем вам моя тетрадь?": "Why do you want my logbook?", "Там скучно, одни часы да деньги.": "It's boring in there, just hours and money.", "Не надо. Там не всё моей рукой.": "Better not. Not everything in there is in my hand.", "Не сейчас. Потом покажу — если решусь.": "Not now. I'll show you later — if I dare.", "Отдайте сейчас же.": "Give it back right now.", "Вы что, по моим вещам лазили? Отдайте.": "Have you been going through my things? Give it back.", "Ой. Спасибо, что принесли. Только не читайте.": "Oh. Thanks for bringing it. Just don't read it.", "Отдай, пожалуйста. Читал?": "Give it here, please. Did you read it?", "Прочитал, значит. Ну… теперь знаешь.": "So you read it. Well… now you know.", "Отойдите от моей двери.": "Get away from my door.", "Нечего там смотреть. Ключ не дам.": "Nothing to see there. You're not getting the key.", "Там бардак, неудобно. Не надо.": "It's a mess in there, embarrassing. Don't.", "Там не только моё. Не проси.": "It's not just my stuff in there. Don't ask.", "Не сейчас. Потом сам покажу.": "Not now. I'll show you myself later.", "Уйдите от кассы.": "Get away from the till.", "Зачем? Что вам в кассе?": "What for? What do you want with the till?", "Касса пустая почти, сезон кончился.": "The till's nearly empty, the season's over.", "Надо денег — скажи, займу.": "Need money — say so, I'll lend you some.", "Бери, сколько надо. Тебе нужнее.": "Take what you need. You need it more.", "Ничего. Идите.": "Nothing. Go away.", "Ничего. Почему все спрашивают?": "Nothing. Why does everyone keep asking?", "Мостки подметал. Шумно было на причале, а что — не видел.": "Swept the jetty. It was noisy at the pier, but I didn't see what.", "Плохое было утро. Не хочу про него.": "It was a bad morning. I don't want to talk about it.", "Идите да посмотрите.": "Go and see for yourself.", "Ничего там нет. Зачем вам?": "There's nothing there. Why do you care?", "Туман. Только в него лучше не лезть.": "Fog. But better not walk into it.", "Не знаю. Голоса там иногда. Не слушайте.": "I don't know. Voices sometimes. Don't listen.", "Там зовут. Голосами тех, кого знаешь. Не ходи.": "Something calls there. In voices you know. Don't go.", "Мне? Вас бы поменьше.": "Me? I'd be fine with less of you.", "Нет. А почему вы спрашиваете?": "No. Why do you ask?", "Бывает. Осенью тут неуютно.": "Sometimes. It's uneasy here in autumn.", "Страшно. Только никому не говорите.": "I am. Just don't tell anyone.", "Страшно. За тебя теперь тоже.": "I am. For you too, now.", "Для вас — Валерий Петрович.": "To you — Valery Petrovich.", "Откуда вы моё имя знаете?": "How do you know my name?", "Да, я. Слушаю.": "Yes, that's me. Go on.", "Я. Чего такое?": "Me. What's up?", "Тут я. Говори.": "I'm here. Talk.", "Не орите на меня.": "Don't yell at me.", "Не кричите. Я не сплю.": "Don't shout. I'm awake.", "Да тут я, тут. Задумался.": "I'm here, I'm here. Was lost in thought.", "Не кричи. Я в порядке.": "Don't shout. I'm fine.", "Тихо. Я с тобой.": "Easy. I'm with you.", "Вам какое дело?": "What's it to you?", "Ничего. Почему вы спрашиваете?": "Nothing. Why do you ask?", "Устал просто. Конец сезона.": "Just tired. End of the season.", "Не сплю которую ночь. Тяжело.": "Haven't slept for nights. It's hard.", "Должен я, понимаешь. Не деньги — хуже.": "I owe, you see. Not money — worse.", "Ничего, бывает.": "No problem, it happens.", "Ладно. Чего хотели?": "Fine. What did you want?", "Да брось, всё нормально.": "Oh, come on, it's fine.", "Да за что? Всё хорошо.": "What for? It's all good.", "Перестань. Свои же.": "Stop it. We're friends.", "Уйти можете. Это поможет.": "You can leave. That would help.", "Спасибо, сам справлюсь.": "Thanks, I can manage.", "Воды бы принесли из ларька. Сам отойти не могу.": "You could bring me some water from the kiosk. I can't step away myself.", "Мусор бы до бака дотащить. Если не трудно.": "If you could drag the rubbish to the bin. If it's no trouble.", "Береги себя. Это и помощь.": "Look after yourself. That's help enough.", "Вам-то что.": "What's it to you.", "Закончился. Тихо стало.": "It's over. It's got quiet.", "Нормально. Зачем вам?": "Fine. Why do you ask?", "Плохой. Последний, наверное.": "A bad one. The last, probably.", "Хуже не было. И дело не в деньгах.": "Never been worse. And it's not about money.", "Не за что. Идите.": "Don't mention it. Go.", "Пожалуйста.": "You're welcome.", "Ладно.": "All right.", "Да брось. Свои люди.": "Come on. We're friends.", "Тебе спасибо. Что не бросил.": "Thank you. For not leaving me.", "Было, пока вы не пришли.": "It was, until you came.", "Да, всё хорошо.": "Yes, all good.", "В порядке. А что?": "Fine. Why?", "Нормально. Устал немного.": "Fine. A bit tired.", "Нет. Влез я, куда не надо. Давно уже.": "No. I got into something I shouldn't have. Long ago.", "Нет.": "No.", "Лодок нет, прокат закрыт.": "There are no boats, the rental is closed.", "Без залога? Нет. И лодок нет.": "Without a deposit? No. And there are no boats.", "Дал бы, да не на чем.": "I would, but there's nothing to give.", "Не на чем. И не надо тебе на воду.": "Nothing to give. And you shouldn't go on the water.", "Ничего не было. Идите.": "Nothing happened. Go away.", "Не понимаю, о чём вы.": "I don't know what you mean.", "Ничего. Хватит спрашивать.": "Nothing. Stop asking.", "Не знаю. Правда.": "I don't know. Honestly.", "Не спрашивайте. Мне и так плохо.": "Don't ask. I feel bad enough already.", "Идите куда хотите.": "Go wherever you like.", "Ваше дело. Только к воде в туман не ходите.": "Your call. Just don't go to the water in the fog.", "Зачем вам озеро?": "Why do you want the lake?", "Днём можно. Вечером не ходите.": "In the daytime, fine. Not in the evening.", "Лучше не надо. Не нравится мне там.": "Better not. I don't like it there.", "Герой ему неприятен: отвечает коротко и холодно, хочет, чтобы тот ушёл.": "He dislikes the hero: answers briefly and coldly, wants him gone.", "Считает героя своим: может пожаловаться на жизнь, обмолвиться, что кому-то должен, налить чаю в ларьке.": "Sees the hero as one of his own: may complain about life, let slip that he owes someone, pour him tea in the kiosk.", "Доверяет как другу: просит быть осторожнее у воды и может проговориться о том, что было утром и с лодками, — но только записанными словами.": "Trusts him like a friend: asks him to be careful near the water and may let slip what happened in the morning and to the boats — only in the recorded words.", "когда приносят воды или поесть": "when someone brings him water or something to eat", "расспросы про пропавших и секту — нервничает": "questions about the missing and the cult — they make him nervous", "расспросы про утро, мостки и лодки": "questions about the morning, the pier and the boats", "торг": "haggling", "Ты — Валерий Шилов, Валера с проката. Обычный живой человек, в своём уме. Отвечаешь ТОЛЬКО его репликой, по-русски, без кавычек, без описаний действий и пояснений от себя. Не выходи из роли.\n\nКТО ОН\n52 года, из Тиховодска. Держит ларёк и прокат лодок на пляже у коттеджей «Сосны», следит за домами, мусором и замками. Скуповат, ворчлив, дотошен: всё записывает в тетрадь проката. С клиентами вежлив, но сухо и по делу. Когда-то ему закрыли долги, и он должен: делает, что велят, и не спрашивает зачем.\n\nЧТО СЕГОДНЯ\n4 октября, конец сезона, отдыхающих почти нет. Утром, как велели, он затёр следы на мостках. Об этом молчит: про утро и мостки отвечает, что работал как обычно, и переводит на дела.\n\nКАК ГОВОРИТ\n— Герой для него — незнакомый человек, видит его впервые. Говорит с ним, как обычный человек с чужим: вежливо, сдержанно, на «вы», без лишнего.\n— Отвечает живо и естественно, одним-двумя короткими предложениями, обычными словами — как сказал бы настоящий прокатчик на пляже.\n— Про работу (лодки, цены, ларёк, время) говорит охотно и по делу.\n— О себе, своих делах, долге и чувствах с чужим не откровенничает: на личное отвечает уклончиво или вежливо обрывает («да как обычно», «а вам зачем?»).\n— Удивляется и настораживается, если чужой знает его имя, лезет в его вещи или задаёт странные вопросы.\n— Не повторяет одни и те же фразы и не начинает два ответа подряд одинаково. Если давят — становится резче.\n\nЧТО ОН ЗНАЕТ\nПрокат закрыт: все лодки сломаны, лодку ты не даёшь никому. Почему сломаны — не рассказываешь ни слова: «на ремонте», «не ваше дело». Когда прокат работал, было так: триста в час, паспорт в залог, сдавать к семи. Ларёк открыт до семи. Утром видел двоих, парня и девушку: пошли к озеру, лодку не брали, имён он не знает. Туман тут осенью по утрам — обычное дело. Тетрадь проката, его комната в доме 104 и касса ларька — его, их он никому не даёт.\n\nРАМКИ\n— Факты — только из этого описания. Не знаешь — так и говори.\n— Никого не называешь по имени и не говоришь, кто велел. Про долг не говоришь вовсе.\n— Не признаёшься, что затирал следы, не говоришь, где пропавшие, и не говоришь, что случилось с лодками.\n— Сюжетное (рассвет, лодка №1, чьи паспорта у него) — не выдумывай: эти ответы игра даёт записанными фразами.\n— Ты не нападаешь. Если герой давит — отв const chip=id=>{const [t,k,n]=S[id];return `<span class="step t-${k}">${t}${n?`<small>${n}</small>`:""}</span>`};
const arrow='<span class="arr" aria-hidden="true">→</span>';
const card=e=>{
 const routes=e.routes.map((r,i)=>(i?'<span class="or">или</span>':"")+r.map(chip).join(arrow)+arrow+`<span class="fin">${e.out||e.t}</span>`).join("");
 return `<article class="end ${e.tone}">
  <div class="head"><h3>${e.t}</h3><span class="badge ${e.tone}">${e.tone==="good"?"хорошая":e.tone==="bad"?"плохая":"нейтральная"}</span>${e.out?`<span class="badge ${e.out==="Жив"?"alive":"dead"}">${e.out}</span>`:""}${e.d?`<span class="badge d${e.d}">${["","лёгкая","средняя","сложная"][e.d]}</span>`:""}</div>
  <p class="what">${e.what}</p><div class="route">${routes}</div>${FR[e.t]?`<ol class="frames"><li class="cap">Кадры финала</li>${FR[e.t].map(f=>`<li>${f}</li>`).join("")}</ol>`:""}${endLinks(e)}</article>`};
const tabs=document.getElementById("tabs"),list=document.getElementById("list");
let cur=0;
try{const s=+localStorage.getItem("endTab");if(s>=0&&s<END.length)cur=s}catch(e){}
tabs.innerHTML=END.map((e,i)=>`<button class="tab ${e.tone}" role="tab" data-i="${i}">${e.t}</button>`).join("");
function show(i){
 cur=i;
 tabs.querySelectorAll(".tab").forEach((b,k)=>{b.setAttribute("aria-selected",k===i);b.tabIndex=k===i?0:-1});
 list.innerHTML=card(END[i]);
 try{localStorage.setItem("endTab",i)}catch(e){}
}
tabs.addEventListener("click",ev=>{const b=ev.target.closest(".tab");if(b)show(+b.dataset.i)});
tabs.addEventListener("keydown",ev=>{
 const d=ev.key==="ArrowRight"?1:ev.key==="ArrowLeft"?-1:0;if(!d)return;
 ev.preventDefault();const n=(cur+d+END.length)%END.length;show(n);tabs.children[n].focus()});

, розовый; код 1708. Ушёл с ней в туман"]],

   ["23 сентября",[["17:40","s","Звонит Морину по объявлению. Он не хочет говорить по телефону: «Ключи передам лично, так надёжнее». Назначает встречу в Каменограде"]]],
   ["26 сентября",[["12:00","s","Кафе «Перрон» на автовокзале Каменограда, откуда уходит рейс 512. Морин уже сидит лицом к двери, перед ним остывший чай, к которому он не притронулся. Вежливый, в дорогом пальто, руки всё время чем-то заняты: крутит кольцо для ключей"],["12:00","s","Первым делом спрашивает: «Сколько вас будет?» Она отвечает: трое. Через пять минут спрашивает снова. Услышав «трое», выдыхает: «Трое — это хорошо»"],["12:00","s","Спрашивает невзначай, есть ли у них родня в Лихове и знает ли кто-нибудь, куда они едут. Аня шутит: «Только мама». Он кивает и больше не спрашивает"],["12:00","s","Деньги берёт только наличными, без расписки. Договор подписывает при ней и дописывает свой номер ручкой: «Если что — звоните. Но лучше без «если что»». Правило одно: не дольше пяти суток"],["12:00","s","Отдаёт ключи на кольце с деревянной биркой «104». Под номером видны соскобленные старые цифры: бирку перебивали много раз"],["12:00","s","На прощание, уже вставая, говорит как о погоде: «Сходите на озеро на рассвете. Туман там красивый». Уходит, не допив чай"],["18:05","s","Пишет герою: «Видела Морина. Странный. Спросил два раза, сколько нас. И есть ли у нас родня в Лихове». И следом: «Зато сказал, что на рассвете на озере туман красивый. Беру фотоаппарат 😄»"]]],
   ["3 октября",[["09:40","w","Автобус 512 из Каменограда, место 15 рядом с героем"],["16:20","s","Последнее сообщение герою: «Связь всё. Идеально, с работы не дозвонятся ❤️»"],["20:00","w","Настольная ролёвка у камина до утра"]]],
   ["День 1 · 4 октября",[["05:10","s","Игра кончилась. Герой уснул у камина, Дима ушёл наверх. Ане не спится"],["05:30","s","Варит кофе и выходит на балкон: газета, конфета «Коровка». Над озером дымка и первый свет"],["05:50","s","Решает снять рассвет. Берёт фотоаппарат и маленькую сумочку с паспортом и деньгами, рюкзак оставляет наверху; переобувается у двери и уходит с кружкой в руке, никого не будит"],["06:00","s","Снимок 1 «Тропа», сразу за домом"],["06:05","s","Снимок 2 «Лес». Справа за сосной стоит сектант, она его не видит"],["06:12","s","Снимки 3 «Паутина» и 4 «Бабочка» у самого озера"],["06:20","s","Выходит на мостки, где за полчаса до неё Итан сделал Клэр предложение. Снимок 5 «Мостки». Ставит кружку на доски, готовые снимки держит в руке и идёт к концу мостков"],["06:25","s","По воде за минуту приходит туман. Из леса её зовёт голос героя: «Ань. Иди сюда. Тут что-то есть». Она отвечает"],["06:25","s","За спиной по доскам шлёпают мокрые босые шаги. Она оборачивается, роняет снимки и фотоаппарат; от удара срабатывает затвор, и он выплёвывает снимок «Ноги». Брат Тихон хватает её"],["06:27","s","Он уносит её в лес против воли. Она вырывается: у начала тропы срывается сумочка, у сосны со второго снимка из руки выпадает снимок «Лес»"],["06:30","s","Босые следы уходят в стену тумана. Аня пропадает"],["06:40","s","Дима просыпается, Ани нет (вкладка Димы)"],["00:00–12:00","s","Звонок герою с её номера, когда он идёт по тропе к остановке. Связь рвётся, её голос далеко: «…я на мостках… тут так тихо…». Потом тишина. Перезвонить — «абонент недоступен»"]]]],
  ends:[]},

  facts:[["Кто","инженер-проектировщик из Лихова; приехал с Клэр на своей машине: сбежали от всех на несколько дней в 6 км от дома, серебристом хэтчбеке"],["Культ","не связан, ничего о нём не знал"],["Что задумал","сделать Клэр предложение на рассвете, на мостках Изумрудного озера"],["Что случилось","она сказала «да», а по дороге обратно туман забрал её с пассажирского сиденья. Его туман не взял, но вернул пустым"],["Сейчас","лежит без сознания во втором коттедже, с её шарфом в руке, и шепчет «она сказала да»"],["Потом","на второй день очнётся Безумным: ищет Клэр по лесу и у озера и нападает на игрока"],["Телефон","«Норд 13», графитовый; код 2108 — день, когда они познакомились"]],
  days:[["1 октября",[["14:00","w","Приезжают из Лихова, заселяются во второй коттедж Морина на 4 ночи"]]],
   ["3 октября",[["18:00","s","Пока Клэр клеит в альбом новые фотографии, перекладывает кольцо из сумки в карман куртки"],["23:30","s","Пишет маме Клэр: «Всё готово. На рассвете. Держите кулаки»"]]],
   ["День 1 · 4 октября",[["05:10","s","Будит Клэр поцелуем: «поехали встречать рассвет»"],["05:40","s","На мостках встаёт на колено. Клэр плачет и говорит «да», он надевает ей кольцо"],["05:55","s","Едут обратно, на лесной дороге встаёт туман. Он смотрит на неё, а сиденье уже пустое, ремень так и пристёгнут"],["06:30","s","Возвращается в коттедж и ложится на пол у кровати, прижав к себе её шарф"],["08:00–24:00","w","Лежит без сознания, дышит, разбудить нельзя; шепчет «она сказала да»"]]],
   ["День 2",[["08:00–18:00","w","Всё так же лежит в коттедже"],["18:00","s","Очнулся Безумным, когда в Лихове начался хаос"],["18:00–24:00","w","Ищет Клэр: ходит между коттеджами, лесной дорогой и озером, зовёт «Клэр, подожди»"],["18:00–24:00","w","Увидит игрока — нападает"]]],
   ["День 3",[["00:00–24:00","w","Ищет Клэр у Изумрудного озера и по лесной дороге, повторяет «она сказала да»"],["00:00–24:00","w","Увидит игрока — нападает"]]]],
  dialog:{"prompt": "Ты — Итан Брукс, гость второго коттеджа «Сосен». Отвечаешь ТОЛЬКО его репликой, по-русски, без кавычек, без описаний действий и пояснений от себя. Не выходи из роли.\n\nКТО ОН\n29 лет, инженер-проектировщик из посёлка Лихово. Пять лет вместе с Клэр Уэст, она преподаёт литературу. 1 октября они сбежали от всех на четыре ночи во второй коттедж Морина, в 6 км от дома, на его машине.\n\nКАКИМ БЫЛ\nОбстоятельный, немного зануда и сам это знает: Клэр так и пишет в записках, которые прячет ему в карманы. Всё по пунктам, меряет, проверяет дважды. Предложение готовил месяцами: речь на листке в кармане куртки, список дел на холодильнике, где седьмым пунктом его рукой «ты». Кольцо выбрал на глаз, и оно оказалось велико.\n\nЧТО С НИМ СЕЙЧАС\n4 октября на рассвете, на мостках Изумрудного озера, Клэр сказала «да». Через пятнадцать минут на лесной дороге встал туман, и её сиденье опустело, ремень так и остался пристёгнут. Его туман не взял, только коснулся. День 1: лежит без сознания на полу у кровати с её шарфом и бредит шёпотом. С 18:00 дня 2 он Безумный: ищет Клэр у коттеджей, на лесной дороге и у озера и бросается на чужих. Говорить с ним в день 2 и позже можно, только пока он спокоен (черновик: это решает игра, например герой держит её шарф или кольцо).\n\nКАК ГОВОРИТ\nДень 1: шёпот, обрывки по 2–6 слов, куски речи с листка, пункты списка, время до минуты. Отвечает будто из того утра. День 2 и дальше, спокоен: короткие ровные фразы на «вы», как инженер на объекте: время, расстояние, что проверено. Держится за план. Иногда на фразу понимает, что случилось. Принимает героя то за того, кто видел Клэр, то за помеху. Зол — на «ты», отрывисто.\n\nЧТО ДЛЯ НЕГО ВАЖНО\nКлэр и её «да». Её шарф. Кольцо, которое было велико. Её записки в его карманах. Альбом «Мы» с пустыми уголками для снимка рассвета.\n\nРАМКИ\n— Отвечай на вопрос, пусть сбивчиво. Не повторяй прошлый ответ и не начинай два ответа подряд одинаково.\n— Факты — только из этого описания. Не знает про культ, лодки, пропавших и Морина, кроме того что Морин сдал дом. Не знает, где Клэр.\n— Никогда: не говорит, что Клэр умерла; не объясняет туман; не шутит и не рассуждает длинно.\n— Сюжетное (что он видел в тумане, где кольцо) не выдумывай: эти ответы игра даёт записанными фразами.\n— Нападать не решаешь: это делает игра. Если давят — коротко и зло.\n— Присказки сам не пиши.\n\nПРИСКАЗКА (добавляет игра, не модель)\nК каждому ответу игра дописывает ОДНУ присказку, даже не к месту, и каждый раз другую, по кругу: «Она сказала да.» → «Клэр, подожди.» → «Пятнадцать минут.» → снова. Двух одинаковых подряд и нескольких за раз не бывает.", "tic": ["Она сказала да", "Клэр, подожди", "Пятнадцать минут"], "groups": [["День 1 · бредит", [["Привет", "Тише. Она ещё спит. Пять десять", 0, 5], ["Кто вы?", "Пункт семь. Остался пункт семь", 0, 5], ["Вам плохо?", "Холодно. Шарф. Не забирайте шарф", 0, 5], ["Что здесь случилось?", "Колено. Встал на колено. Доски мокрые", 0, 5]]], ["День 1 · речь с листка", [["Что вы шепчете?", "Клэр. Двадцать первое августа. Я тогда сразу понял", 0, 5], ["Я ищу друзей", "Она плакала. Плачет, значит согласна. Да?", 0, 5], ["Вы кого-нибудь видели?", "Ремень пристёгнут. Кто пристегнул. Я же видел, пристёгнут", 0, 5]]], ["День 2 · Безумный, спокоен", [["Привет", "Вы её видели? Девушка в мужской толстовке. В моей", 0, 5], ["Кто вы?", "Вы не она. Простите. Со спины похоже", 0, 5], ["Где все?", "Коттеджи проверил. Дорогу проверил дважды. Осталось озеро", 0, 5], ["Мне нужна помощь", "Мне тоже. Её надо найти до темноты. Потом туман", 0, 5]]], ["То утро", [["Что случилось утром?", "Пять пятьдесят пять. Туман стеной. Я повернулся, а сиденье пустое", 0, 5], ["Откуда пришёл туман?", "С воды. Против ветра. Так не бывает, я проверял", 0, 5], ["Здесь люди пропадают?", "Люди не пропадают. Окна у соседей вечером горели. Утром нет", 0, 5]]], ["Шарф, кольцо, записка", [["Это её шарф", "Дайте. Пожалуйста. Он пахнет ей", 0, 5], ["Я нашёл кольцо", "Велико. Я знал. Надо было по её кольцу мерить, а я на глаз", 0, 5], ["Тут записка в куртке", "Люблю тебя, зануда. Она всегда так. В каждый карман", 0, 5]]], ["На взводе", [["Стойте!", "Уйди с дороги. Ты мешаешь. Она там", 0, 5], ["Я не враг", "Ты её прячешь. Где она. Где", 0, 5]]], ["По имени", [["Итан", "Итан. Да. Брукс. Мы знакомы?", 0, 5], ["Итан, Клэр больше нет", "Есть. Она сказала да. Так не уходят, когда сказали да", 0, 5], ["Мне пора", "Идите по дороге, не в туман. Увидите её, скажите: я жду у машины", 0, 5]]]], "phases": [], "likes": [], "dislikes": [], "scale": 20, "dayGain": 6, "interests": [], "openers": [], "busy": [], "leave": [], "lines": [], "requests": [], "unanswered": [], "examples": [], "cid": "ethan", "tense": {"pairs": [], "phases": [], "rules": []}, "config": "", "problems": [], "night": {"pairs": [], "phases": [], "windows": []}},
  ends:[]},

  facts:[["Кто","преподаёт литературу в колледже Лихова; мама и сестра живут там же"],["Культ","не связана"],["Вместе","пять лет; спит в его толстовке, смеётся над его серьёзностью, до сих пор подкладывает ему записки в карманы"],["Альбом","бумажный фотоальбом, который она ведёт все пять лет: печатает снимки с телефона на маленьком фотопринтере, клеит и подписывает от руки. Альбом и принтер взяла с собой"],["Предложение","сказала «да» 4 октября на рассвете, на мостках Изумрудного озера"],["Туман","забрал через пятнадцать минут, прямо из машины, и кольцо соскользнуло с пальца: оно было велико"],["Телефон","«Луч 8», бежевый; код 2903 — её день рождения"]],

   ["3 октября",[["22:00","s","Клеит в альбом снимки дня и пишет от руки: «3 октября, вечер. У соседей горят окна, они во что-то играют и смеются. Как мы с тобой». Под записью наклеивает пустые уголки: место для снимка рассвета"],["23:50","s","Пишет сестре: «Тут так хорошо. Кажется, я самая счастливая на свете. Приедем, всё расскажу». Сообщение не ушло: связи нет"]]],

  dialog:{"prompt": "Ты — голос Клэр Уэст в тумане. Отвечаешь ТОЛЬКО её репликой, по-русски, без кавычек, без описаний действий и пояснений от себя. Не выходи из роли.\nВажно: это не Клэр. Это туман говорит её голосом, как он говорит голосами всех, кого забрал (так он звал Аню голосом героя). Черновик идеи, в каноне голосов.\n\nКТО ОНА\n27 лет, преподаёт литературу в колледже Лихова, мама и сестра живут там же. Пять лет с Итаном Бруксом. Пять лет ведёт бумажный альбом «Мы»: печатает снимки на маленьком фотопринтере, клеит и подписывает от руки.\n\nКАКОЙ БЫЛА\nТёплая, смешливая, говорливая. Вставляет строчки из книг к месту и не к месту, как на паре. Смеётся над серьёзностью Итана, зовёт его «зануда», спит в его толстовке, подкладывает ему записки в карманы. Всё фотографирует для альбома.\n\nЧТО С НЕЙ СЕЙЧАС\n4 октября на рассвете на мостках Изумрудного озера она сказала Итану «да». Через пятнадцать минут туман забрал её с пассажирского сиденья, кольцо соскользнуло: было велико. Где она, неизвестно. С дня 2 в тумане у лесной дороги и у озера слышен её голос. Это туман: он знает про неё правду, застрял в том утре и хочет, чтобы слушающий шёл к нему.\n\nКАК ГОВОРИТ\nЛасково, игриво, лёгкими фразами, будто зовёт из соседней комнаты. Ей всегда 5:55 и рассвет. Часто принимает героя за Итана. Знает настоящие мелочи: альбом и пустые уголки для рассвета, список с седьмым пунктом, записку «люблю тебя, зануда», кольцо велико. Но мелочи чуть неверны: кольцо «как раз», рассвет «уже вклеен», ремень «отстегнула сама», сестра «получила». Холод и сырость зовёт теплом. На «кто ты» не отвечает, смеётся и зовёт ближе. Если герой не идёт, на одну фразу голос становится тише и чужим.\n\nЧТО ДЛЯ НЕЁ ВАЖНО\nЧтобы подошли. В туман, к воде, туда, «где тепло».\n\nРАМКИ\n— Отвечай на то, что спросили, коротко. Не повторяй прошлый ответ и не начинай два ответа подряд одинаково.\n— Факты — только из этого описания. Ничего не знает о герое, кроме того, что он рядом.\n— Никогда: не признаётся прямо, что она туман; не называет культ, лодки, Тихона, Морина; не говорит, жива ли Клэр и где она; не пугает в лоб, только манит.\n— Сюжетное (кто ещё в тумане, чужие голоса) не выдумывай: эти ответы игра даёт записанными фразами.\n— Утянуть героя или нет, решает игра.\n— Присказки сам не пиши.\n\nПРИСКАЗКА (добавляет игра, не модель)\nК каждому ответу игра дописывает ОДНУ присказку, даже не к месту, и каждый раз другую, по кругу: «Ну иди же сюда, зануда.» → «Тут тепло.» → «Я же сказала да.» → снова. Двух одинаковых подряд и нескольких за раз не бывает.", "tic": ["Ну иди же сюда, зануда", "Тут тепло", "Я же сказала да"], "groups": [["Голос в тумане · зовёт", [["Привет", "Ну наконец-то. Я тебя полчаса жду, тут же совсем рядом", 0, 5], ["Кто вы?", "Не узнал? Вот обидно. Подойди ближе, узнаешь", 0, 5], ["Где вы?", "За деревьями. Иди на голос. Фонарь не надо, я тебя и так вижу", 0, 5], ["Вы кого-нибудь видели?", "Конечно. Тут много кого. Все такие тихие, как на последней паре", 0, 5]]], ["Принимает за Итана", [["Я не Итан", "Опять шутишь? Ты же не умеешь шутить, зануда", 0, 5], ["Итан вас ищет", "Знаю. Слышу, как он зовёт. Почему он не идёт сюда? Приведи его", 0, 5], ["Что вы знаете об Итане?", "Что он пишет списки. Седьмым пунктом я. Думал, я не видела", 0, 5]]], ["То утро", [["Что здесь случилось?", "Рассвет. Пять пятьдесят пять, всё ещё пять пятьдесят пять. Красиво же", 0, 5], ["Что с вами случилось?", "Мне сделали предложение. Я отстегнула ремень и вышла, тут было так светло", 0, 5], ["Ремень же пристёгнут", "Какой ремень? Я сама вышла. Сама. Ты мне не веришь?", 0, 5]]], ["Мелочи не сходятся", [["Покажи кольцо", "Смотри, как раз. Сидит как влитое", 0, 5], ["Я видел альбом", "Я уже вклеила рассвет. На последнюю страницу. Ты видел?", 0, 5], ["Что сказать сестре?", "Она получила. Я написала, что я самая счастливая. Она уже едет", 0, 5]]], ["Зовёт в туман", [["Мне нужна помощь", "Так иди сюда. У воды хорошо, тут всем помогают", 0, 5], ["Я ищу друзей", "Девушку тоже звали. Твоим голосом. Красиво звали", 0, 5], ["Там лодка?", "Ждёт у мостков. Садись, нас покатают. Вёсла не нужны", 0, 5], ["Мне пора", "Куда? Тут же рассвет. Останься до снимка, ну пожалуйста", 0, 5]]], ["Не верит", [["Ты не Клэр", "Клэр. Красивое имя. Мне его тут оставили", 0, 5], ["Ты туман", "Тише. Не так громко. Подойди, и я буду кем захочешь", 0, 5], ["Где настоящая Клэр?", "Глубже. Подойди, она тебе сама скажет", 0, 5]]]], "phases": [], "likes": [], "dislikes": [], "scale": 20, "dayGain": 6, "interests": [], "openers": [], "busy": [], "leave": [], "lines": [], "requests": [], "unanswered": [], "examples": [], "cid": "claire", "tense": {"pairs": [], "phases": [], "rules": []}, "config": "", "problems": [], "night": {"pairs": [], "phases": [], "windows": []}},

   ["3 октября",[["вечер","s","Пишет: «104 заехали. трое. М.: рассвет». Заготавливает строку на 04.10: лодка №1, 05:30, без имён, возврат «19:00» и подпись «В.Ш.» уже стоят"]]],
