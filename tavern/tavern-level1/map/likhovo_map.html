      var dist = Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY);
      if (dist < 6) { addMark(kind, view.x, view.y); return; }
      if (ev.type === 'pointerup' && ev.clientY < trayTop) addMark(kind, wx(ev.clientX - r.left), wy(ev.clientY - r.top));
    }
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }


  function loadIcons(urls) {
    ORDER.forEach(function (k) {
      if (!urls || typeof urls[k] !== 'string' || !urls[k]) { delete images[k]; return; }
      var img = new Image(); img.onload = function () { renderSamples(); refresh(); }; img.src = urls[k]; images[k] = img;
    });
  }



  window.addEventListener('resize', resize);
  renderTabs(); renderSamples(); renderZoombar(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  if (window.claude && window.claude.use) {
    window.claude.use('db').then(function (db) {
      if (!db) { setStatus('Расстановка не сохраняется в этом просмотре'); return; }
      roadsCol = db.collection('roads');
      roadsCol.orderBy('t').onSnapshot(function (snap) {
        var next = [];
        snap.docs.forEach(function (d) {
          var v = d.data();
          if (!v || !Array.isArray(v.pts) || v.pts.length < 4) return;
          var ws = Array.isArray(v.ws) && v.ws.length * 2 === v.pts.length ? v.ws.map(function (x) { return Number(x) || RIVER_W0; }) : null;
          next.push({ id: d.id, pts: v.pts.map(Number), w: Number(v.w) || ROAD_W, w0: Number(v.w0) || null, ws: ws, kind: v.kind === 'river' ? 'river' : 'road', style: v.kind !== 'river' && ROAD_STYLES[v.style] ? v.style : null, t: Number(v.t) || 0 });
        });
        roads = next;
        var keep = {}; Object.keys(sel).forEach(function (id) { if (marks.some(function (m) { return m.id === id; }) || roads.some(function (r) { return r.id === id; }) || areas.some(function (a) { return a.id === id; })) keep[id] = true; }); sel = keep;
        draw();
      }, function () {});
      areasCol = db.collection('areas');
      areasCol.orderBy('t').onSnapshot(function (snap) {
        var held = drag && (drag.type === 'vertex' || drag.type === 'areamove') ? drag.a : null;
        var next = [];
        snap.docs.forEach(function (d) {
          var v = d.data();
          if (!v || !Array.isArray(v.pts) || v.pts.length < 6) return;
          if (held && held.id === d.id) { next.push(held); return; }
          next.push({ id: d.id, area: true, pts: v.pts.map(Number), name: typeof v.name === 'string' ? v.name : '', color: /^#[0-9A-Fa-f]{6}$/.test(v.color) ? v.color : AREA_COLORS[0][1], t: Number(v.t) || 0 });
        });
        areas = next;
        var keep = {}; Object.keys(sel).forEach(function (id) { if (marks.some(function (m) { return m.id === id; }) || roads.some(function (r) { return r.id === id; }) || areas.some(function (a) { return a.id === id; })) keep[id] = true; }); sel = keep;
        draw();
      }, function () {});
      strokesCol = db.collection('strokes');
      strokesCol.orderBy('t').onSnapshot(function (snap) {
        var next = [];
        snap.docs.forEach(function (d) {
          var v = d.data();
          if (!v || !Array.isArray(v.pts) || v.pts.length < 2 || typeof v.color !== 'string') return;
          next.push({ id: d.id, color: v.color, erase: v.erase === true, size: Number(v.size) || 0.1, pts: v.pts.map(Number) });
        });
        strokes = next; draw();
      }, function () {});
      col = db.collection('marks');
      setStatus('Подключено');
      col.onSnapshot(function (snap) {
        var dragging = {};
        if (drag && drag.type === 'move') drag.group.forEach(function (g) { dragging[g.id] = g; });
        var next = [];
        snap.docs.forEach(function (d) {
          var v = d.data(); if (!v || !KINDS[v.kind]) return;
          if (dragging[d.id]) { next.push(dragging[d.id]); return; }
          next.push({ id: d.id, kind: v.kind, x: Number(v.x) || 0, y: Number(v.y) || 0, rot: Number(v.rot) || 0 });
        });
        marks = next;
        var keep = {}; marks.forEach(function (m) { if (sel[m.id]) keep[m.id] = true; }); roads.forEach(function (r) { if (sel[r.id]) keep[r.id] = true; }); areas.forEach(function (a) { if (sel[a.id]) keep[a.id] = true; }); sel = keep;
        if (!marks.length) setStatus('Иконок пока нет — перетащите первую из панели');
        refresh();
      }, function () { setStatus('Связь с картой потеряна — обновите страницу'); });
      db.doc('config/icons').onSnapshot(function (d) { loadIcons(d.exists ? d.data() : null); }, function () {});
    });
  } else {
    setStatus('Расстановка не сохраняется в этом просмотре');
  }
})();
</script>
