global
  log /dev/log local0
  maxconn 200000
  nbthread 2
  cpu-map auto:1/1-2 0-1
  tune.ssl.default-dh-param 2048  # ← здесь правильно
  tune.bufsize 32768
  tune.ssl.cachesize 1000000

frontend http
  bind *:443 ssl crt /etc/haproxy/ssl/cert.cer

  maxconn 50000
  mode http
  option httplog
  log global
  # ошибки соединения (TLS-рукопожатие, h2) — с причиной, SNI и протоколом
  error-log-format "%ci:%cp [%t] %ft conn_err=%[fc_err_str] ssl_err=%[ssl_fc_err_str] sni=%[ssl_fc_sni] tls=%[ssl_fc_protocol] alpn=%[ssl_fc_alpn]"
  # dontlognull выключен 2026-09-16 для отладки 999: логируем и соединения без запросов
  #option dontlognull
  backlog 10000

  #http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Port
  http-request del-header X-Forwarded-Proto

  capture request header Host len 32
  capture request header Referer len 128
  capture request header User-Agent len 128

  acl host_present hdr(host) -m len gt 0
  #use_backend %[req.hdr(host),lower,field(1,'.')] if host_present

  default_backend one

  timeout client 1m

defaults
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout queue 1m
    timeout http-keep-alive 5s
    timeout client-fin 10s
    timeout server-fin 10s
    maxconn 200000
    option http-server-close
    option redispatch
    retries 3

resolvers dns
  hold valid 60s
  timeout retry 1000ms
  nameserver dns1 8.8.8.8:53

backend one
  mode http
  http-request set-header Host olimpapi.cc
  http-request set-header X-Forwarded-For %[src]
  server one--olimpapi.cc olimpapi.cc:443 resolvers dns resolve-prefer ipv4 check ssl verify none check-sni olimpapi.cc sni str(olimpapi.cc)

backend two
  mode http
  http-request set-header Host olimpapi2.com
  http-request set-header X-Forwarded-For %[src]
  server two--olimpapi2.com olimpapi2.com:443 resolvers dns resolve-prefer ipv4 check ssl verify none check-sni olimpapi2.com sni str(olimpapi2.com)
